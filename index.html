<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y TREE — three lenses on one portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#17130E;
  --canvas:#141109; --card:#1F1B12; --card-2:#272115; --border:#3A3225;
  --text:#F2EEE3; --dim:#B7AE9C; --faint:#897F6C;
  --accent:#C69A4E; --accent-ink:#17120A;
  --ok:#63A468; --line:#332D20;
  --radius:15px; --tap:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ---- shell ---- */
.stage{display:flex;gap:44px;justify-content:center;align-items:flex-start;padding:48px 28px 72px;min-height:100vh}
.phone{flex:0 0 auto;width:393px;max-width:100%;padding:13px;border-radius:58px;position:relative;
  background:linear-gradient(155deg,#403a30,#17130d 46%,#0a0805);
  box-shadow:0 55px 120px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.045)}
.phone::before{content:"";position:absolute;top:24px;left:50%;transform:translateX(-50%);
  width:116px;height:33px;background:#000;border-radius:20px;z-index:5}
.app{border-radius:47px;overflow:hidden;background:var(--canvas);display:flex;flex-direction:column;
  height:min(830px,calc(100vh - 120px));aspect-ratio:393/852;position:relative}
.panel{flex:1 1 0;max-width:330px;position:sticky;top:48px;font-size:14px;color:var(--dim);line-height:1.62}
.panel .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.panel h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:20px;color:var(--text);margin:8px 0 10px;line-height:1.25}
.panel p{margin:10px 0} .panel ul{list-style:none;margin:12px 0}
.panel li{padding-left:20px;position:relative;margin:9px 0}
.panel li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.panel .fine{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
@media (max-width:1000px){
  .stage{display:block;padding:0;background:var(--canvas)}
  .panel{display:none}
  .phone{width:100%;max-width:480px;margin:0 auto;padding:0;border-radius:0;box-shadow:none;background:none}
  .phone::before{display:none}
  .app{border-radius:0;height:auto;min-height:100dvh;aspect-ratio:auto}
}

/* ---- chrome ---- */
.bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;
  padding:14px 16px;background:var(--canvas);border-bottom:1px solid var(--line)}
@media (min-width:1001px){ .app .bar{padding-top:42px} }
.brand{font-family:Fraunces,Georgia,serif;letter-spacing:.18em;font-size:14px;color:var(--accent)}
.back{background:none;border:0;color:var(--accent);font:inherit;font-size:15px;min-height:var(--tap);cursor:pointer;padding:0 2px}
.hchip{background:var(--card);border:1px solid var(--border);color:var(--text);font:inherit;font-size:12.5px;
  border-radius:999px;min-height:34px;padding:0 11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.hchip .k{color:var(--faint);font-size:10.5px}
.bar .sp{margin-left:auto}
main{flex:1;overflow-y:auto;padding:20px 18px 26px}
main>*+*{margin-top:18px}
.nav{display:flex;background:var(--canvas);border-top:1px solid var(--line)}
.nav button{flex:1;background:none;border:0;color:var(--faint);font:inherit;font-size:10.5px;cursor:pointer;
  padding:8px 0 10px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7}

/* ---- type ---- */
h1.scr{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:22px}
.eyebrow{font-size:12px;letter-spacing:.05em;color:var(--faint)}
.hero{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:40px;line-height:1.05;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--faint);margin-top:5px}
p.lead{font-size:14px;color:var(--dim);line-height:1.6}
.muted{font-size:12.5px;color:var(--faint);line-height:1.55}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.linkbtn{color:var(--accent);background:none;border:0;font:inherit;font-size:13px;cursor:pointer;padding:0}
.quiet{color:var(--faint);background:none;border:0;font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0}

.status{display:flex;gap:12px;align-items:flex-start}
.status .d{width:9px;height:9px;border-radius:50%;background:var(--ok);margin-top:7px;flex:none}
.status .b{font-size:14px;color:var(--dim);line-height:1.55}
.status .b strong{color:var(--text);font-weight:600}
.decision{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.decision p{font-size:13px;color:var(--dim);line-height:1.55;margin:6px 0}
.dbtns{display:flex;gap:8px;margin-top:10px}
.dbtns button{flex:1;min-height:42px;border-radius:10px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.dbtns .approve{background:var(--accent);color:var(--accent-ink);border:0}
.dbtns .ask{background:none;border:1px solid var(--border);color:var(--dim)}
.note{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;
  padding:12px 13px;font-size:13px;color:var(--dim);line-height:1.55}

.seg{display:flex;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px}
.seg button{flex:1;min-height:42px;border:0;border-radius:8px;background:none;color:var(--dim);font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.hint{font-size:12.5px;color:var(--faint);line-height:1.55}

/* provider list */
.miw{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:8px 0}
.miw span{display:block;height:100%}
.legrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:8px}
.legrow span{display:inline-flex;align-items:center;gap:6px}
.legrow i{width:10px;height:10px;border-radius:3px;display:inline-block}
.grp{margin-top:20px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:2px}
.grp-h .n{font-family:Fraunces,Georgia,serif;font-size:16px}
.grp-h .v{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px;white-space:nowrap}
.acct{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;padding:8px 0;
  border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left}
.acct:last-child{border-bottom:0}
button.acct{cursor:pointer}
.acct .n{font-size:15px;display:block}
.acct .s{font-size:12px;color:var(--faint);margin-top:2px;display:block}
.acct .v{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap;text-align:right}
.acct .chev{color:var(--accent);font-size:13px}

/* pie + table */
.pie-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 12px}
.pie-wrap svg{transform:rotate(-90deg)}
.pie-c{font-family:Fraunces,Georgia,serif;font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.pie-s{font-size:12px;color:var(--faint)}
.leg{margin:8px 0 4px}
.leg .r{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;padding:0}
.leg .r:last-child{border-bottom:0}
button.r{cursor:pointer}
.leg .sw{width:11px;height:11px;border-radius:3px;flex:none}
.leg .n{flex:1;font-size:14.5px}
.leg .v{font-variant-numeric:tabular-nums;font-size:14px;color:var(--dim)}
.leg .p{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--faint);width:44px;text-align:right}
.leg .chev{color:var(--accent);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
table.t td,table.t th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right}
table.t th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600}
table.t tr.tot td{border-top:1px solid var(--border);border-bottom:0;font-weight:600;color:var(--text)}
.tcap{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:16px 0 2px}

.bucket{margin-top:12px}
.bucket .bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bucket .bn{font-family:Fraunces,Georgia,serif;font-size:16px}
.bucket .bv{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
.bucket p{font-size:13px;color:var(--dim);line-height:1.55;margin-top:5px}
.bucket .ret{font-size:12.5px;color:var(--faint);margin-top:5px}

/* chart */
.mtab{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.mtab button{background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);font:inherit;font-size:14px;padding:8px 0;min-height:40px;cursor:pointer}
.mtab button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.readout{font-family:Fraunces,Georgia,serif;font-size:18px;font-variant-numeric:tabular-nums}
.readout small{font-family:Inter,sans-serif;color:var(--faint);font-size:11.5px;display:block;font-weight:400;margin-top:2px}
.cbody{display:flex;gap:6px;margin-top:8px}
.cy{display:flex;flex-direction:column;justify-content:space-between;font-size:9px;color:var(--faint);text-align:right;padding:10px 0 4px;min-width:38px;font-variant-numeric:tabular-nums}
.cplot{flex:1;min-width:0}
.cx{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);margin-top:3px;padding-left:44px}
svg .ln{fill:none;stroke:var(--accent);stroke-width:2}
svg .lnp{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
svg .lnc{fill:none;stroke:#8f8a80;stroke-width:1.4}
svg .base{stroke:var(--line)} svg .hit{fill:transparent;cursor:pointer} svg .dot{fill:var(--accent)}
.cmp{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.cmp button{background:none;border:1px solid var(--border);color:var(--dim);font:inherit;font-size:12px;border-radius:999px;min-height:34px;padding:0 11px;cursor:pointer}
.cmp button[aria-pressed="true"]{border-color:#8f8a80;color:var(--text)}
.daterow{display:flex;align-items:center;gap:8px;margin-top:10px}
.daterow input[type=date]{background:var(--card-2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:12.5px;border-radius:9px;min-height:38px;padding:0 9px;color-scheme:dark}
.daterow span{color:var(--faint);font-size:12.5px}
.piv{overflow-x:auto;margin-top:10px}
.piv table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.piv td,.piv th{border:1px solid var(--line);padding:7px 9px;text-align:right;white-space:nowrap;min-width:60px}
.piv th:first-child,.piv td:first-child{text-align:left;min-width:106px;position:sticky;left:0;background:var(--card)}
.piv thead th{color:var(--faint);font-size:10px;text-transform:uppercase;background:var(--card-2)}
.piv tr.tot td{font-weight:600;color:var(--text);background:var(--card-2)}
.pivsel{background:var(--card-2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:12.5px;border-radius:9px;min-height:38px;padding:0 8px;color-scheme:dark}

/* tiles (PE) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.tile .k{font-size:11px;color:var(--faint)}
.tile .v{font-family:Fraunces,Georgia,serif;font-size:19px;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .x{font-size:10.5px;color:var(--faint);margin-top:4px;line-height:1.35}
.commit{height:22px;border-radius:6px;background:var(--card-2);display:flex;overflow:hidden;margin:8px 0}
.commit .c1{background:var(--accent)} .commit .c2{background:rgba(198,154,78,.28)}

/* alerts */
.fchip{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.fchip button{background:none;border:1px solid var(--border);color:var(--dim);font:inherit;font-size:12px;border-radius:999px;min-height:34px;padding:0 11px;cursor:pointer}
.fchip button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.month{font-size:11px;letter-spacing:.04em;color:var(--faint);padding:14px 0 4px;border-bottom:1px solid var(--line)}
.alert{padding:13px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .ah{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.alert .lbl{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:2px 8px;color:var(--dim)}
.alert .lbl.act{color:var(--accent);border-color:var(--accent)}
.alert .dt{font-size:11px;color:var(--faint);white-space:nowrap}
.alert .ti{font-size:14.5px;margin-top:6px}
.alert .bl{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:3px}

/* profile */
.setlist{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.setlist .sh{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:14px 16px 6px}
.setlist .o{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;background:none;border:0;border-top:1px solid var(--line);
  color:var(--text);font:inherit;font-size:14.5px;text-align:left;cursor:pointer;padding:0 16px}
.setlist .sh + .o{border-top:0}
.setlist .o .s{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.setlist .o .ck{margin-left:auto;color:var(--accent);font-weight:700}
.setlist .o .go{margin-left:auto;color:var(--accent);font-size:13px}

/* notes */
.notecard{border:1px solid var(--border);border-radius:12px;padding:13px;background:var(--card)}
.note-ta{width:100%;min-height:76px;background:var(--card-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font:inherit;font-size:13px;padding:9px;resize:vertical}
.note-b{font-size:13px;color:var(--dim);line-height:1.55;white-space:pre-wrap}
.note-meta{font-size:11px;color:var(--faint);margin-top:6px}
.note-act{display:flex;gap:8px;margin-top:9px}
.note-act .sv{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;min-height:38px;padding:0 15px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.note-act .cn{background:none;border:1px solid var(--border);color:var(--dim);border-radius:9px;min-height:38px;padding:0 13px;font:inherit;font-size:13px;cursor:pointer}
.addnote{width:100%;background:none;border:1px dashed var(--border);color:var(--dim);border-radius:11px;min-height:44px;font:inherit;font-size:13.5px;cursor:pointer}

.foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.5}

/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(10,7,3,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--card);border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:20px 18px 26px;max-height:86%;overflow-y:auto}
.sheet h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:19px;margin-bottom:6px}
.sheet .grp-l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;background:none;border:0;border-bottom:1px solid var(--line);
  color:var(--text);font:inherit;font-size:15px;text-align:left;cursor:pointer}
.opt:last-of-type{border-bottom:0}
.opt .ck{margin-left:auto;color:var(--accent);font-weight:700}
.opt .sfx{margin-left:auto;color:var(--faint);font-size:13px}
.xseg{display:flex;gap:5px;background:var(--canvas);border-radius:10px;padding:4px;margin-top:6px}
.xseg button{flex:1;min-height:40px;border:0;border-radius:7px;background:none;color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer}
.xseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.preview{background:var(--canvas);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.6}
.preview b{color:var(--text)}
.sheet .go{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;min-height:48px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;margin-top:16px}
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="app">
    <header class="bar" id="bar"></header>
    <main id="screen"></main>
    <nav class="nav" id="nav"></nav>
  </div></div>
  <aside class="panel" id="panel"></aside>
</div>

];
var GROUPS=['Investment and cash accounts','Residential properties','Investment properties','Business interests','Private equity'];
var GS={'Investment and cash accounts':'Investment & cash'};
var CADENCE={
  'Investment and cash accounts':'Priced daily',
  'Residential properties':'Last valued 15 Aug 2026',
  'Investment properties':'Last valued 15 Aug 2026',
  'Business interests':'Last valued 30 Jun 2026',
  'Private equity':'Valued twice a year · next December',
};
var AC=[['Equities','#4E86C4'],['Bonds','#C97A45'],['Cash','#4FA089'],['Property','#C69A4E'],['Private business','#B5708F'],['Private equity','#8B7BC0']];

var EQ=[
  ['Global Equity Index Fund',[['Fidelity ISA','Mine',150000],['Fidelity GIA','Joint',300000],['HL SIPP','Mine',160000],['Vanguard ISA',"Partner's",60000]]],

function buildNW(){
  var seed=11, v=5000000, prior=5000000, market=5000000, contrib=4600000, out=[];
  function rnd(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }
  var d=new Date(2021,0,1), end=new Date(2026,7,1);
  while(d<=end){
    var y=d.getFullYear(), m=d.getMonth(), r=0.006+(rnd()-0.5)*0.028;
    if(y===2022 && m>=2 && m<=9) r-=0.022;
    if(y===2024 && m<=5) r+=0.014;
    if(y===2026 && m===6) r+=0.02;
    if(y===2026 && m===7) r-=0.035;
    v*=1+r; market*=1+r*0.95+(rnd()-0.5)*0.006; prior*=1+r-0.0018;
    var add=6000+rnd()*4000; if(m===3) add+=40000; if(y===2023 && m===5) add+=600000;
    contrib+=add; v+=add*0.98; market+=add*0.97; prior+=add*0.985;
    out.push({t:y+'-'+String(m+1).padStart(2,'0'),v:Math.round(v),prior:Math.round(prior),market:Math.round(market),c:Math.round(contrib)});
    d.setMonth(m+1);
  }
  var k=out[out.length-1], f=8420000/k.v, fp=7745000/k.prior, fm=8180000/k.market, fc=6900000/k.c;
  out.forEach(function(p){ p.v=Math.round(p.v*f); p.prior=Math.round(p.prior*fp); p.market=Math.round(p.market*fm); p.c=Math.round(p.c*fc); });
  return out;
}

function perfChart(w,sc){
  var W=300,H=150;
  var you=w.map(function(p){return p.v*sc;});
  var pn=3, proj=[]; var pv=you[you.length-1]; for(var i=0;i<pn;i++){ pv*=1.02; proj.push(pv); }
  var series=[{cls:'ln',pts:you}];
  if(state.cmp.prior) series.push({cls:'lnc',pts:w.map(function(p){return p.prior*sc;})});
  if(state.cmp.market) series.push({cls:'lnc',pts:w.map(function(p){return p.market*sc;})});
  var all=flat(series.map(function(s){return s.pts;})).concat(proj);
  var mn=Math.min.apply(null,all), mx=Math.max.apply(null,all), pad=(mx-mn)*0.08||1; mn-=pad; mx+=pad;
  var n=you.length+pn;
  var X=function(i){return i*W/(n-1);}, Y=function(v){return (1-(v-mn)/(mx-mn))*H;};
  var idx=state.chartIdx==null?you.length-1:Math.min(state.chartIdx,you.length-1);
  var out='<div class="readout">'+money(you[idx])
    + '<small>'+(state.chartIdx==null?'Tap the line to read a date and value'
        :'<b style="color:var(--dim)">'+mLabel(w[idx].t)+'</b> · '+money(you[idx])+' <button class="quiet" data-act="cp:reset">clear</button>')+'</small></div>';
  var svg='<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  svg+='<line class="base" x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'"/>';
  series.forEach(function(s,si){ if(si===0) return;
    svg+='<polyline class="'+s.cls+'" vector-effect="non-scaling-stroke" points="'+s.pts.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ')+'"/>'; });
  var ps=you.length-1;
  svg+='<polyline class="lnp" vector-effect="non-scaling-stroke" points="'+([X(ps)+','+Y(you[ps])].concat(proj.map(function(v,i){return X(ps+1+i).toFixed(1)+','+Y(v).toFixed(1);}))).join(' ')+'"/>';
  svg+='<polyline class="ln" vector-effect="non-scaling-stroke" points="'+you.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ')+'"/>';
  you.forEach(function(v,i){
    if(i===idx){ svg+='<line class="base" x1="'+X(i).toFixed(1)+'" y1="0" x2="'+X(i).toFixed(1)+'" y2="'+H+'"/><circle class="dot" cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="4" vector-effect="non-scaling-stroke"/>'; }
    svg+='<rect class="hit" x="'+(X(i)-6).toFixed(1)+'" y="0" width="12" height="'+H+'" data-act="cp:'+i+'"/>';
  });
  svg+='</svg>';
  var mid=Math.floor((w.length-1)/2);
  return out+'<div class="cbody"><div class="cy"><span>'+short(mx)+'</span><span>'+short((mx+mn)/2)+'</span><span>'+short(mn)+'</span></div>'
    + '<div class="cplot">'+svg+'</div></div>'
    + '<div class="cx"><span>'+mLabel(w[0].t)+'</span><span>'+mLabel(w[mid].t)+'</span><span>+3 proj</span></div>'
    + '<div class="legrow" style="margin-top:8px"><span><i style="background:var(--accent)"></i>You</span>'
    + (state.cmp.prior||state.cmp.market?'<span><i style="background:#8f8a80"></i>'+(state.cmp.prior&&state.cmp.market?'Provider & market':state.cmp.prior?'Previous provider':'Global market')+'</span>':'')
    + '<span><i style="background:var(--accent);opacity:.5"></i>Projected</span></div>';
}

var PDIM={ assetclass:{l:'Asset class',g:function(r){return r[3];}}, provider:{l:'Provider',g:function(r){return GS[r[0]]||r[0];}},
  owner:{l:'Owner',g:function(r){return ownLabel(r[2]);}}, liquidity:{l:'Liquidity',g:function(r){return r[4];}} };
function perfPivot(){
  var L2=rows();
  var rd=PDIM[state.pivRow], cd=state.pivCol==='none'?null:PDIM[state.pivCol];
  var rk=uniq(L2.map(rd.g)), ck=cd?uniq(L2.map(cd.g)):['Total'];
  var grid={}; rk.forEach(function(a){ grid[a]={}; ck.forEach(function(b){ grid[a][b]=0; }); });
  L2.forEach(function(r){ grid[rd.g(r)][cd?cd.g(r):'Total']+=r[5]; });
  var colT={}; ck.forEach(function(b){ colT[b]=sum(rk.map(function(a){return grid[a][b];})); });
  var gt=sum(ck.map(function(b){return colT[b];}));
  rk.sort(function(a,b){ return sum(ck.map(function(c){return grid[b][c];}))-sum(ck.map(function(c){return grid[a][c];})); });
  function sel(id,val,extra){ return '<select class="pivsel" data-piv="'+id+'">'
    + Object.keys(PDIM).map(function(d){return '<option value="'+d+'"'+(val===d?' selected':'')+'>'+PDIM[d].l+'</option>';}).join('')
    + (extra?'<option value="none"'+(val==='none'?' selected':'')+'>None</option>':'')+'</select>'; }
  var h='<div class="daterow"><span>Rows</span>'+sel('pivRow',state.pivRow,false)+'<span>by</span>'+sel('pivCol',state.pivCol,true)+'</div>';
  h+='<div class="piv"><table><thead><tr><th>'+rd.l+'</th>'+ck.map(function(b){return '<th>'+esc(b)+'</th>';}).join('')+(cd?'<th>Total</th>':'')+'</tr></thead><tbody>';
  rk.forEach(function(a){
    var rt=sum(ck.map(function(b){return grid[a][b];}));
    h+='<tr><td>'+esc(a)+'</td>'+ck.map(function(b){var v=grid[a][b];return '<td>'+(v?short(v):'·')+'</td>';}).join('')+(cd?'<td>'+short(rt)+'</td>':'')+'</tr>';
  });
  h+='<tr class="tot"><td>Total</td>'+ck.map(function(b){return '<td>'+short(colT[b])+'</td>';}).join('')+(cd?'<td>'+short(gt)+'</td>':'')+'</tr></tbody></table></div>';
  h+='<p class="muted" style="margin-top:8px">Any dimension by any dimension. Cost basis, unrealised gain and fund look-through would be the next columns.</p>';
  return h;
}

/* ---------- equities drill ---------- */
function renderEquities(){
  var o=state.owner;
  var list=EQ.map(function(e){ var p=e[1].filter(function(x){return o==='All'||x[1]===o;});
    return {name:e[0],provs:p,v:sum(p.map(function(x){return x[2];}))}; }).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
  var t=sum(list.map(function(x){return x.v;}));
  var pc=uniq(flat(list.map(function(x){return x.provs.map(function(p){return p[0];});}))).length;
  var h='<section><div class="eyebrow">Asset class</div><h1 class="scr">Equities</h1></section>';
  h+='<section><div class="hero" style="font-size:32px">'+money(t)+'</div><div class="sub">Held across '+pc+' providers'+(o!=='All'?' · '+ownLabel(o):'')+'</div></section>';
  h+='<p class="lead">Every equity holding you own, combined. Your account view lists these separately.</p>';
  h+='<table class="t"><thead><tr><th>Holding</th><th class="n">Value</th><th class="n">Share</th></tr></thead><tbody>';
  list.forEach(function(x){
    var w=x.provs.map(function(p){return p[0];}).join(', ');
    var cm=x.provs.length>1?' · combined from '+x.provs.length+' accounts':'';
    h+='<tr><td>'+x.name+'<div style="font-size:11px;color:var(--faint);margin-top:2px">'+w+cm+'</div></td><td class="n">'+money(x.v)+'</td><td class="n">'+pct(x.v,t)+'</td></tr>';
  });
  h+='<tr class="tot"><td>Total</td><td class="n">'+money(t)+'</td><td class="n">100%</td></tr></tbody></table>';
  h+='<p class="muted">Your Apple exposure is £90,000 held directly, plus more inside the index and US funds. Full look-through of fund holdings is a natural next step.</p>';
  h+='<div class="foot">Prototype for discussion. Not financial advice. Figures illustrative.</div>';
  document.getElementById('screen').innerHTML=h;
}

/* ---------- private equity ---------- */
function renderPE(){
  var o=state.owner, f=o==='All'?PE:PE.filter(function(x){return x[1]===o;});
  var h='<section><div class="eyebrow">Locked</div><h1 class="scr">Private equity</h1></section>';
  if(!f.length){ h+='<div class="card"><p class="lead">No private equity is held on this basis. Change whose assets to see it.</p></div>'
      + '<div class="foot">Prototype. Not financial advice.</div>'; document.getElementById('screen').innerHTML=h; return; }
  var comm=sum(f.map(function(x){return x[2];})), call=sum(f.map(function(x){return x[3];}));
  var dist=sum(f.map(function(x){return x[4];})), nav=sum(f.map(function(x){return x[5];})), unc=comm-call;
  h+='<section><div class="hero" style="font-size:32px">'+money(nav)+'</div><div class="sub">Current value · valued twice a year, next December</div></section>';
  h+='<p class="lead">Committed capital is drawn down over years. There is no daily price, and it cannot be sold on request.</p>';
  h+='<div class="tiles"><div class="tile"><div class="k">Committed</div><div class="v">'+money(comm)+'</div><div class="x">What you agreed to invest</div></div>'
    + '<div class="tile"><div class="k">Called</div><div class="v">'+money(call)+'</div><div class="x">Paid in so far</div></div>'
    + '<div class="tile"><div class="k">Uncalled</div><div class="v">'+money(unc)+'</div><div class="x">Still to be drawn</div></div>'
    + '<div class="tile"><div class="k">Distributed</div><div class="v">'+money(dist)+'</div><div class="x">Returned to you</div></div></div>';
  h+='<div class="card" style="margin-top:14px"><div class="commit"><div class="c1" style="width:'+(call/comm*100)+'%"></div><div class="c2" style="width:'+(unc/comm*100)+'%"></div></div>'
    + '<div class="legrow"><span><i style="background:var(--accent)"></i>Called</span><span><i style="background:rgba(198,154,78,.28)"></i>Uncalled</span></div></div>';
  h+='<div class="tcap">Likely capital calls</div><table class="t"><tbody>'
    + PE_CALLS.map(function(c){return '<tr><td>'+c[0]+'<div style="font-size:11px;color:var(--faint)">'+c[1]+'</div></td><td class="n">'+c[2]+'</td></tr>';}).join('')
    + '</tbody></table><p class="muted" style="margin-top:6px">Estimates from the fund managers. Worth keeping cash ready to meet these.</p>';
  h+='<div class="foot">Prototype for discussion. Not financial advice. Figures illustrative.</div>';
  document.getElementById('screen').innerHTML=h;
}

/* ---------- alerts ---------- */
function renderAlerts(){
  var f=state.alertFilter;
  var open=ALERTS.filter(function(a){return a[4]==='open' && (f==='All'||a[1]===f);});
  var hist=ALERTS.filter(function(a){return a[4]!=='open' && (f==='All'||a[1]===f);}).sort(function(a,b){return a[0]<b[0]?1:-1;});
  var h='<section><h1 class="scr">Alerts</h1><p class="lead">Everything Y TREE has flagged for you. You are only notified for the ones that need a decision.</p></section>';
  h+='<div class="fchip">'+['All','Decision','Advice','Valuation'].map(function(x){return '<button data-act="af:'+x+'" aria-pressed="'+(f===x)+'">'+x+'</button>';}).join('')+'</div>';
  if(open.length){
    h+='<div class="tcap">Needs your decision</div><div class="card">';
    open.forEach(function(a){
      h+='<div class="alert"><div class="ah"><span class="lbl act">'+a[1]+'</span><span class="dt">'+dstr(a[0])+'</span></div>'
        + '<div class="ti">'+a[2]+'</div><div class="bl">'+a[3]+'</div>'
        + '<div class="dbtns"><button class="approve" data-act="noop">Approve</button><button class="ask" data-act="noop">Ask a question</button></div></div>';
    });
    h+='</div>';
  }
  h+='<div class="tcap">History</div><div class="card">';
  var lm='';
  if(!hist.length) h+='<p class="muted">Nothing under this filter.</p>';
  hist.forEach(function(a){
    var m=MON[+a[0].split('-')[1]-1]+' '+a[0].split('-')[0];
    if(m!==lm){ h+='<div class="month">'+m+'</div>'; lm=m; }
    h+='<div class="alert"><div class="ah"><span class="lbl">'+a[1]+'</span><span class="dt">'+dstr(a[0])+'</span></div>'
      + '<div class="ti">'+a[2]+'</div><div class="bl">'+a[3]+'</div></div>';
  });
  h+='</div>';
  h+=noteBlock('alerts');
  h+='<div class="foot">Prototype for discussion. Not financial advice.</div>';
  document.getElementById('screen').innerHTML=h;
}

/* ---------- profile ---------- */
function renderProfile(){
  function o(key,val,label,s){ return '<button class="o" data-act="set:'+key+':'+val+'"><span>'+label+(s?'<span class="s">'+s+'</span>':'')+'</span>'
    + (lsGet('yt_'+key, key==='detail'?'essentials':'provider')===val?'<span class="ck">✓</span>':'')+'</button>'; }
  var h='<section><h1 class="scr">Profile</h1><p class="lead">Set the app up once to match how you think. None of this is shown to anyone else.</p></section>';
  h+='<div class="setlist">'
    + '<div class="sh">How much detail</div>'
    + o('detail','essentials','Essentials','Headline figures and next steps, plain language')
    + o('detail','full','Full detail','Every calculation and assumption shown')
    + '<div class="sh">Default view</div>'
    + o('dv','provider','By provider','The standard view')
    + o('dv','assetclass','By asset class',null)
    + o('dv','liquidity','By liquidity',null)
    + '<div class="sh">Reporting currency</div>'
    + o('ccy','GBP','Pound sterling',null) + o('ccy','USD','US dollar',null) + o('ccy','EUR','Euro',null)
    + '</div>';
  var kn=Object.keys(NKEYS).map(function(k){return {k:k,n:getNote(k)};}).filter(function(x){return x.n;});
  h+='<div class="tcap">Your notes</div><div class="card">';
  if(!kn.length) h+='<p class="muted">No notes yet. Add one from any screen.</p>';
  kn.forEach(function(x){
    h+='<div class="alert"><div class="ah"><span style="font-family:Fraunces,serif;font-size:14px">'+NKEYS[x.k]+'</span><span class="dt">'+(x.n.u?dstr(x.n.u):'')+'</span></div>'
      + '<div class="bl">'+esc(x.n.t)+'</div></div>';
  });
  h+='</div>';
  h+='<div class="foot">Detail level also lets Y TREE pitch advice at the right depth. It is your preference, never a label shown to anyone.</div>';
  document.getElementById('screen').innerHTML=h;
}

/* ---------- sheets ---------- */
function renderSheet(){
  var host=document.getElementById('sheetHost'); if(host) host.remove();
  if(!state.sheet) return;
  var el=document.createElement('div'); el.id='sheetHost'; var inner='';
  if(state.sheet==='whose'){
    inner='<h2>Whose assets</h2><p class="muted">Changes the total and every view. Also the split an accountant needs.</p>'
      + ['All','Mine',"Partner's",'Joint'].map(function(o){
          var v=sum(LEAF.filter(function(r){return o==='All'||r[2]===o;}).map(function(r){return r[5];}));
          return '<button class="opt" data-act="own:'+encodeURIComponent(o)+'">'+ownLabel(o)+'<span class="sfx">'+money(v)+'</span>'+(state.owner===o?' <span class="ck">✓</span>':'')+'</button>';
        }).join('');
  } else if(state.sheet==='ccy'){
    inner='<h2>Show totals in</h2>'+['GBP','USD','EUR'].map(function(c){
        return '<button class="opt" data-act="ccyset:'+c+'">'+SYM[c]+'  '+CNAME[c]+(state.ccy===c?' <span class="ck">✓</span>':'')+'</button>';
      }).join('')+'<p class="muted" style="margin-top:12px">The overview converts at yesterday’s close. Detail screens keep the native figure.</p>';
  } else if(state.sheet==='export'){
    var x=state.xf;
    function xs(key,opts){ return '<div class="xseg">'+opts.map(function(o){return '<button data-act="xf:'+key+':'+o[0]+'" aria-pressed="'+(x[key]===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>'; }
    var PER={tax:'the 2025/26 tax year',cal:'calendar year 2025',since:'since you joined'};
    var GRP={account:'by account',assetclass:'by asset class',owner:'by owner'};
    var scope=state.owner==='All'?'your whole portfolio':ownLabel(state.owner)+' assets';
    inner='<h2>Statement for your accountant</h2><p class="muted">Replaces the report the client team prepares by hand each month.</p>'
      + '<div class="grp-l">Period</div>'+xs('period',[['tax','Tax year'],['cal','Calendar year'],['since','Since joined']])
      + '<div class="grp-l">Group holdings</div>'+xs('group',[['account','Account'],['assetclass','Asset class'],['owner','Owner']])
      + '<div class="grp-l">Format</div>'+xs('format',[['pdf','PDF'],['csv','Spreadsheet']])
      + '<div class="preview"><b>You will get:</b> a '+(x.format==='pdf'?'PDF':'spreadsheet')+' of '+scope+', '+GRP[x.group]+', covering '+PER[x.period]+', with valuations, cost basis and this year’s income. Dated '+AS_AT+'.</div>'
      + '<button class="go" data-act="noop">Prepare statement</button>';
  }
  el.innerHTML='<div class="sheet-bg" data-act="sheet:close"><div class="sheet" onclick="event.stopPropagation()">'+inner+'</div></div>';
  document.querySelector('.app').appendChild(el);
}

/* ---------- desktop panel ---------- */
var PANEL={
  home:'The home screen. Default is By provider, exactly as clients see it today. By asset class and By liquidity are the two lenses the interview surfaced, added as opt-in views on the same screen with one dismissible line. Nothing is moved for the change-averse majority.',
  performance:'Clients do check performance, especially when markets move. This is one screen for it: net worth over time, an optional comparison, a projection, and a free date range. The number Y TREE is judged on — ahead of the previous provider — is stated plainly, not buried in a chart line. The Table tab is the analyst cut: any dimension by any dimension.',
  alerts:'Advice runs through the app and clients approve it here. Decisions that need a response are pinned; everything else is history. Notifications only fire for the pinned items, about three or four times a year.',
  profile:'A short settings list. Detail level doubles as how Y TREE pitches advice. Notes written on any screen collect here.',
  equities:'Every equity holding, combined across providers. The account view still lists them separately; this is the only place total exposure to one fund or company is visible.',
  pe:'Committed, called, uncalled and distributed capital, plus the likely future calls. No daily price, because there isn’t one.',
};
function renderPanel(){
  document.getElementById('panel').innerHTML=
      '<div class="eyebrow">The idea</div><h2>The same wealth, three lenses</h2>'
    + '<p>Y TREE’s app shows a client’s wealth one way: by which institution holds it. A minority, mostly private-equity and other sophisticated clients, think in asset class and in how quickly they can reach their money.</p>'
    + '<p>This prototype adds those two lenses plus an ownership filter as opt-in views on the existing home, and keeps the supporting screens the interview justifies: performance, alerts, a short profile. Nothing more.</p>'
    + '<div class="eyebrow" style="margin-top:22px">This screen</div><p>'+(PANEL[state.route]||PANEL.home)+'</p>'
    + '<div class="fine">Fictional client, about £8.4m. Figures reconciled across every view. Companion to the one-page problem statement.</div>';
}

/* ---------- events ---------- */
function wireDates(){
  ['dF','dT'].forEach(function(id){ var e=document.getElementById(id); if(e) e.addEventListener('change',function(){
    var a=dateToIdx(document.getElementById('dF').value), b=dateToIdx(document.getElementById('dT').value);
    state.winFrom=Math.min(a,b); state.winTo=Math.max(a,b);
    if(state.winTo-state.winFrom<2) state.winTo=Math.min(NW.length-1,state.winFrom+2);
    state.chartIdx=null; renderPerformance();
  }); });
}
document.addEventListener('change',function(e){
  var s=e.target.closest('.pivsel'); if(s){ state[s.dataset.piv]=s.value; renderPerformance(); }
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var p=el.dataset.act.split(':'), k=p[0], v=p[1];
  if(k==='noop') return;
  if(k==='go'){ location.hash = v==='home'?'':'#/'+v; render(); }
  else if(k==='view'){ state.view=v; renderHome(); }
  else if(k==='sheet'){ state.sheet = v==='close'?null:v; renderSheet(); }
  else if(k==='own'){ state.owner=decodeURIComponent(v); lsSet('yt_owner',state.owner); state.sheet=null; render(); }
  else if(k==='ccyset'){ state.ccy=v; lsSet('yt_ccy',v); state.sheet=null; render(); }
  else if(k==='xf'){ state.xf[v]=p[2]; renderSheet(); }
  else if(k==='dec'){ state.decisionOpen=(v==='open'); renderHome(); }
  else if(k==='vol'){ state.volDismissed=true; lsSet('yt_vol','1'); renderHome(); }
  else if(k==='hint'){ state.hintDismissed=true; lsSet('yt_hint','1'); renderHome(); }
  else if(k==='pmode'){ state.perfMode=v; state.chartIdx=null; renderPerformance(); }
  else if(k==='cmp'){ state.cmp[v]=!state.cmp[v]; renderPerformance(); }
  else if(k==='cp'){ state.chartIdx = v==='reset'?null:parseInt(v,10); renderPerformance(); }
  else if(k==='af'){ state.alertFilter=v; renderAlerts(); }
  else if(k==='set'){ lsSet('yt_'+v,p[2]); if(v==='ccy') state.ccy=p[2]; if(v==='dv') state.defaultView=p[2]; if(v==='detail') state.detail=p[2]; renderProfile(); }
  else if(k==='note'){
    if(v==='edit'){ state.noteEdit=p[2]; render(); }
    else if(v==='save'){ var ta=document.getElementById('nta'); var txt=ta?ta.value.trim():'';
      if(txt){ var prev=getNote(p[2]); lsSet('yt_n_'+p[2], JSON.stringify({t:txt,c:(prev&&prev.c)||new Date().toISOString(),u:new Date().toISOString()})); }
      else { try{ localStorage.removeItem('yt_n_'+p[2]); }catch(err){} }
      state.noteEdit=null; render();
    } else { state.noteEdit=null; render(); }
  }
});
window.addEventListener('hashchange',render);
if(state.defaultView && ['provider','assetclass','liquidity'].indexOf(state.defaultView)>-1) state.view=state.defaultView;
render();
</script>
