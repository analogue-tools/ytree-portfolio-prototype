<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y TREE, three lenses on one portfolio</title>
<style>
:root{
  --bg:#141428; --bg-top:#1c1c3c; --card:#20203C; --card-2:#282848; --line:#33335A;
  --text:#FFFFFF; --dim:#9898B4; --faint:#6C6C8A;
  --teal:#3ED9CE; --teal-deep:#2FB6AE; --teal-ink:#06231F;
  --violet:#9585EC; --pos:#3FCB80; --neg:#F0586A; --pill:#2B2B4A;
  --ac-equities:#4F8DF7; --ac-bonds:#E8894A; --ac-cash:#3FCB80;
  --ac-property:#E0B341; --ac-business:#E066A6; --ac-pe:#9585EC;
  --radius:16px; --tap:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
button{-webkit-appearance:none;appearance:none;border:0;background:none;color:inherit;font:inherit}
html,body{background:#0c0c18}
body{color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:44px 28px 64px;min-height:100vh;
  max-width:1440px;margin:0 auto;background:radial-gradient(130% 90% at 50% 0%,#20203f,#0c0c18)}
.phone{flex:0 0 auto;width:393px;max-width:100%;padding:12px;border-radius:56px;position:relative;
  background:linear-gradient(150deg,#3a3a44,#161622 46%,#0a0a12);
  box-shadow:0 50px 110px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04)}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);
  width:118px;height:34px;background:#000;border-radius:20px;z-index:40}
.app{border-radius:46px;overflow:hidden;background:linear-gradient(180deg,var(--bg-top),var(--bg) 240px);
  display:flex;flex-direction:column;height:min(830px,calc(100vh - 108px));aspect-ratio:393/852;position:relative}
.side{flex:1 1 0;max-width:340px;position:sticky;top:44px;align-self:flex-start;font-size:14px;color:var(--dim);line-height:1.62}
.side .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:700}
.side h2{font-weight:600;font-size:20px;color:var(--text);margin:8px 0 10px;line-height:1.25;letter-spacing:-.01em}
.side p{margin:10px 0}
.side .fine{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
@media (max-width:1080px){
  .stage{display:block;padding:0;background:var(--bg)}
  .side{display:none}
  .phone{width:100%;max-width:520px;margin:0 auto;padding:0;border-radius:0;box-shadow:none;background:none}
  .phone::before{display:none}
  .app{border-radius:0;height:100dvh;aspect-ratio:auto}
}

#screen{flex:1;overflow-y:auto;padding:16px 18px 24px;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
#screen>*+*{margin-top:18px}

.navbar{flex:none;display:flex;justify-content:space-around;align-items:center;height:58px;
  background:rgba(16,16,32,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.navbar button{width:56px;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6E6E8A;position:relative}
.navbar button[aria-current="page"]{color:var(--teal)}
.navbar svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navbar .b{position:absolute;top:9px;right:9px;min-width:15px;height:15px;border-radius:999px;background:var(--neg);color:#fff;
  font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--bg)}

.nwhead{display:flex;align-items:center;gap:10px}
.nwhead h1{font-size:20px;font-weight:600;letter-spacing:-.01em;flex:1}
.iconbtn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--teal);cursor:pointer;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.whose{display:inline-flex;align-items:center;gap:6px;background:var(--pill);color:var(--text);font-size:12.5px;font-weight:600;
  border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.whose .cx{color:var(--teal);font-size:10px}
.backrow{display:flex;align-items:center;gap:2px;margin-bottom:2px}
.backrow button{display:inline-flex;align-items:center;gap:3px;color:var(--teal);font-size:15px;cursor:pointer;padding:4px 4px 4px 0}
.backrow .ttl{flex:1;text-align:center;font-size:16px;font-weight:600;margin-right:38px}

.nwbig{font-size:40px;font-weight:600;letter-spacing:-.025em;color:var(--teal);line-height:1.05;margin-top:10px}
.nwdelta{margin-top:5px;font-size:14px;font-weight:600}
.nwdelta .since{color:var(--faint);font-weight:400;display:block;margin-top:2px;font-size:12.5px}
.up{color:var(--pos)} .dn{color:var(--neg)}

.chartbox{cursor:pointer}
.spark{width:100%;height:150px;display:block}
.readout{font-size:13px;color:var(--dim);margin-top:4px;min-height:18px}
.readout b{color:var(--text)}
.cx{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:4px}

.pills{display:flex;background:var(--pill);border-radius:12px;padding:3px;gap:2px}
.pills button{flex:1;min-height:36px;border-radius:9px;font-size:12.5px;color:var(--dim);cursor:pointer;white-space:nowrap}
.pills button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);font-weight:700}

.lensrow{margin-top:2px}
.lenslabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 7px 2px}
.hint{font-size:12px;color:var(--faint);line-height:1.5;margin-top:8px}
.hint button{color:var(--teal);cursor:pointer;text-decoration:underline;font-size:12px}

.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--dim)}
.act .ic{width:48px;height:48px;border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;position:relative}
.act .ic svg{width:20px;height:20px;stroke:var(--teal);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act .bd{position:absolute;top:-1px;right:-1px;min-width:15px;height:15px;border-radius:999px;background:var(--neg);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 3px}

.sectlabel{font-size:13px;font-weight:600;color:var(--text);margin:2px 2px 0}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ic{width:30px;height:30px;border-radius:9px;flex:none}
.row .ic.rd{border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--dim)}
.row .m{flex:1;min-width:0}
.row .m b{font-size:15.5px;font-weight:500;display:block}
.row .m small{font-size:12px;color:var(--faint);display:block;margin-top:1px}
.row .v{text-align:right;white-space:nowrap}
.row .v b{font-size:15.5px;font-weight:500;display:block}
.row .v small{font-size:12.5px;display:block;margin-top:1px}
.row .v small.z{color:var(--faint)}
.row .chev{color:var(--faint);font-size:15px;flex:none}
.rowtot{display:flex;justify-content:space-between;padding:13px 2px 2px;border-top:1px solid var(--line);font-weight:600;font-size:14.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.card .ch{font-size:13px;font-weight:600;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--dim)} .kv .val{font-weight:600}
.why{border-left:3px solid var(--teal);background:var(--card-2);border-radius:12px;padding:12px 13px;font-size:12.5px;color:var(--dim);line-height:1.55}
.why b{color:var(--text)}
.dsum{text-align:center;padding:8px 0 2px}
.dsum .lab{font-size:13px;color:var(--dim)}
.dsum .big{font-size:34px;font-weight:600;letter-spacing:-.02em;color:var(--teal);margin-top:2px}
.dsum .asat{font-size:12px;color:var(--faint);margin-top:4px}
.lead{font-size:13.5px;color:var(--dim);line-height:1.55}
.muted{font-size:12px;color:var(--faint);line-height:1.5}
.tealink{color:var(--teal);cursor:pointer;font-size:13px}

.dec{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:14px;padding:14px;background:var(--card)}
.dec .dl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--violet);font-weight:700}
.dec .dt{font-size:15px;font-weight:600;margin-top:5px}
.dec .db{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:4px}
.dbtn{display:flex;gap:8px;margin-top:11px}
.dbtn button{flex:1;min-height:42px;border-radius:11px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--line);color:var(--text)}
.dbtn .go{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}

.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line)}
.tabs button{border-bottom:2px solid transparent;color:var(--faint);font-size:13.5px;padding:9px 0;min-height:40px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--teal)}
.fpills{display:flex;gap:7px;flex-wrap:wrap}
.fpills button{border:1px solid var(--line);color:var(--dim);font-size:12px;border-radius:999px;min-height:34px;padding:0 12px;cursor:pointer}
.fpills button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:700}
.perfhead{font-size:30px;font-weight:600;letter-spacing:-.02em;color:var(--teal)}
svg .ln{fill:none;stroke:var(--teal);stroke-width:2}
svg .lnb{fill:none;stroke:#B9B9D6;stroke-width:1.5;stroke-dasharray:4 3}
svg .lnp{fill:none;stroke:var(--teal);stroke-width:1.5;stroke-dasharray:3 3;opacity:.55}
svg .axis{stroke:var(--line)} svg .scan{stroke:var(--faint)} svg .hit{fill:transparent;cursor:pointer} svg .dot{fill:var(--teal)}
svg .fill{fill:url(#tg)}
.cbody{display:flex;gap:6px;margin-top:6px}
.cy{display:flex;flex-direction:column;justify-content:space-between;font-size:9px;color:var(--faint);text-align:right;padding:6px 0 16px;min-width:38px}
.cplot{flex:1;min-width:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px}
.stk{display:flex;align-items:flex-end;gap:5px;height:150px;margin-top:6px}
.stkcol{flex:1;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;min-width:0}
.stkcol i{display:block}
.stkx{display:flex;gap:5px;margin-top:4px}
.stkx span{flex:1;text-align:center;font-size:9px;color:var(--faint);overflow:hidden}
.daterow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}
.daterow input{background:var(--card-2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:12px;border-radius:9px;min-height:36px;padding:0 9px;color-scheme:dark}
.pivwrap{overflow-x:auto}
.pivwrap table{border-collapse:collapse;font-size:12px;width:100%}
.pivwrap td,.pivwrap th{border:1px solid var(--line);padding:7px 9px;text-align:right;white-space:nowrap}
.pivwrap th:first-child,.pivwrap td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.pivwrap thead th{color:var(--faint);font-size:10px;text-transform:uppercase;background:var(--card-2)}
.pivwrap tr.t td{font-weight:700;background:var(--card-2)}
.pivsel{background:var(--card-2);border:1px solid var(--line);color:var(--text);font:inherit;font-size:12px;border-radius:9px;min-height:36px;padding:0 8px;color-scheme:dark}

.commit{height:8px;border-radius:5px;background:var(--card-2);overflow:hidden;margin:10px 0 8px}
.commit i{display:block;height:100%;background:var(--teal)}
.split{display:flex;justify-content:space-between;font-size:12px}
.split .t{color:var(--teal);font-weight:600;font-size:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--card-2);border-radius:11px;padding:11px}
.tile .k{font-size:11px;color:var(--faint)}
.tile .val{font-size:17px;font-weight:600;margin-top:3px}

.mhead{display:flex;align-items:center;gap:10px;padding:2px 0 12px;border-bottom:1px solid var(--line)}
.mav{width:36px;height:36px;border-radius:50%;background:#243a6b;color:var(--teal);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.mhead .mt b{display:block;font-size:15px} .mhead .mt small{display:block;font-size:12px;color:var(--faint)}
.mconv{display:flex;flex-direction:column;gap:10px;padding:14px 0}
.mb{max-width:82%} .mb.them{align-self:flex-start} .mb.me{align-self:flex-end}
.mbx{font-size:13.5px;line-height:1.5;padding:10px 12px;border-radius:14px;display:inline-block}
.mb.them .mbx{background:var(--card-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.mb.me .mbx{background:rgba(62,217,206,.16);border:1px solid rgba(62,217,206,.32);border-bottom-right-radius:4px}
.mbd{font-size:10px;color:var(--faint);margin-top:3px}
.composer{display:flex;gap:8px;margin-top:6px}
.composer input{flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:11px;min-height:44px;padding:0 12px;color:var(--text);font:inherit;font-size:13px}
.composer button{background:var(--teal);color:var(--teal-ink);border-radius:11px;min-height:44px;padding:0 16px;font-weight:700;font-size:13px;opacity:.5}
.thread{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.thread:last-child{border-bottom:0}
.thread .tm{flex:1;min-width:0} .thread .tm b{font-size:14.5px;display:flex;align-items:center;gap:6px}
.thread .tm small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .tw{font-size:11px;color:var(--faint);white-space:nowrap;align-self:flex-start;margin-top:2px}
.udot{width:7px;height:7px;border-radius:50%;background:var(--teal);flex:none}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);color:var(--dim);font-size:12px;border-radius:999px;min-height:34px;padding:0 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:700}
.mdiv{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:14px 0 4px;border-bottom:1px solid var(--line)}
.alert{padding:13px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.atop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lbl{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim)}
.lbl.on{color:var(--violet);border-color:var(--violet)}
.adate{font-size:11px;color:var(--faint);white-space:nowrap}
.atitle{font-size:14.5px;margin-top:6px}
.ablurb{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:3px}

.setlist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.setlist .sh{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:14px 15px 6px}
.setlist .o{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-top:1px solid var(--line);color:var(--text);font-size:14.5px;text-align:left;cursor:pointer;padding:0 15px}
.setlist .sh + .o{border-top:0}
.setlist .o .s{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.setlist .o .ck{margin-left:auto;color:var(--teal);font-weight:700}
.note{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:13px}
.note .cap{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.note textarea{width:100%;min-height:74px;background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;font-size:13px;padding:9px;resize:vertical}
.note .b{font-size:13px;color:var(--dim);line-height:1.5;white-space:pre-wrap}
.note .meta{font-size:11px;color:var(--faint);margin-top:6px}
.note .act2{display:flex;gap:8px;margin-top:9px}
.note .sv{background:var(--teal);color:var(--teal-ink);border-radius:9px;min-height:38px;padding:0 15px;font-weight:700;font-size:13px;cursor:pointer}
.note .cn{border:1px solid var(--line);color:var(--dim);border-radius:9px;min-height:38px;padding:0 13px;font-size:13px;cursor:pointer}
.addnote{width:100%;border:1px dashed var(--line);color:var(--dim);border-radius:11px;min-height:44px;font-size:13px;cursor:pointer}
.foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.5}

.sheet-bg{position:absolute;inset:0;background:rgba(6,6,14,.66);display:flex;align-items:flex-end;z-index:60}
.sheet{width:100%;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 16px 26px;max-height:82%;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet h2{font-size:17px;font-weight:600;margin-bottom:6px}
.sheet .grp{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-bottom:1px solid var(--line);color:var(--text);font-size:15px;text-align:left;cursor:pointer}
.opt:last-of-type{border-bottom:0}
.opt .ck{margin-left:auto;color:var(--teal);font-weight:700}
.opt .sfx{margin-left:auto;color:var(--faint);font-size:13px}
.xseg{display:flex;gap:4px;background:var(--pill);border-radius:10px;padding:4px;margin-top:6px}
.xseg button{flex:1;min-height:38px;border-radius:7px;color:var(--dim);font-size:12px;cursor:pointer}
.xseg button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);font-weight:700}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:14px;font-size:12px;color:var(--dim);line-height:1.6}
.preview b{color:var(--text)}
.sheet .send{width:100%;background:var(--teal);color:var(--teal-ink);border-radius:11px;min-height:48px;font-weight:700;font-size:15px;cursor:pointer;margin-top:16px}
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="app">
    <main id="screen"></main>
    <nav class="navbar" id="nav"></nav>
  </div></div>
  <aside class="side" id="side"></aside>
</div>

<script>
/* ============================================================================
   Y TREE prototype. An iteration on the current app: the same net-worth home,
   with an opt-in control to group your wealth by provider, by asset class, or
   by how quickly you can reach it. One fictional client, figures reconciled.
   ========================================================================== */
var CLIENT='Jeanne', AS_AT='30 Aug 2026', JOINED='15 Feb 2025';

/* [providerGroup, account, owner, assetClass, liquidity, value] */
var LEAF=[
  ['Investment and cash accounts','Coutts current & savings','Joint','Cash','Liquid',180000],
  ['Investment and cash accounts','Fidelity Stocks & Shares ISA','Mine','Equities','Liquid',360000],
  ['Investment and cash accounts','Fidelity Stocks & Shares ISA','Mine','Bonds','Liquid',40000],
  ['Investment and cash accounts','Fidelity Stocks & Shares ISA','Mine','Cash','Liquid',20000],
  ['Investment and cash accounts','Fidelity General Investment Account','Joint','Equities','Liquid',820000],
  ['Investment and cash accounts','Fidelity General Investment Account','Joint','Bonds','Liquid',360000],
  ['Investment and cash accounts','Fidelity General Investment Account','Joint','Cash','Liquid',80000],
  ['Investment and cash accounts','Hargreaves Lansdown SIPP','Mine','Equities','Liquid',470000],

function buildNW(){
  var seed=11,v=5000000,bench=5000000,contrib=4600000,out=[];
  function rnd(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }
  var d=new Date(2021,0,1),end=new Date(2026,7,1);
  while(d<=end){
    var y=d.getFullYear(),m=d.getMonth(),r=0.006+(rnd()-0.5)*0.028;
    if(y===2022&&m>=2&&m<=9) r-=0.022;
    if(y===2024&&m<=5) r+=0.014;
    if(y===2026&&m===6) r+=0.02;
    if(y===2026&&m===7) r-=0.035;
    v*=1+r; bench*=1+r-0.0016+(rnd()-0.5)*0.004;
    var add=6000+rnd()*4000; if(m===3) add+=40000; if(y===2023&&m===5) add+=600000;
    contrib+=add; v+=add*0.98; bench+=add*0.985;
    out.push({t:y+'-'+String(m+1).padStart(2,'0'),v:Math.round(v),bench:Math.round(bench),c:Math.round(contrib)});
    d.setMonth(m+1);
  }
  var k=out[out.length-1],f=8420000/k.v,fb=7745000/k.bench,fc=6900000/k.c;
  out.forEach(function(p){ p.v=Math.round(p.v*f); p.bench=Math.round(p.bench*fb); p.c=Math.round(p.c*fc); });
  return out;
}

function renderAlerts(){
  var f=state.alertFilter;
  var open=ALERTS.filter(function(a){return a[4]==='open'&&(f==='All'||a[1]===f);});
  var hist=ALERTS.filter(function(a){return a[4]!=='open'&&(f==='All'||a[1]===f);}).sort(function(a,b){return a[0]<b[0]?1:-1;});
  var h='<div class="nwhead"><h1>Alerts</h1></div>';
  h+='<p class="lead">Everything Y TREE has flagged. You are only notified for the ones that need a decision.</p>';
  h+='<div class="chips">'+['All','Decision','Advice','Valuation'].map(function(x){return '<button class="chip" data-act="af:'+x+'" aria-pressed="'+(f===x)+'">'+x+'</button>';}).join('')+'</div>';
  if(open.length){ h+='<div class="sectlabel">Needs your decision</div><div class="card">';
    open.forEach(function(a){ h+='<div class="alert"><div class="atop"><span class="lbl on">'+a[1]+'</span><span class="adate">'+dstr(a[0])+'</span></div>'
      + '<div class="atitle">'+a[2]+'</div><div class="ablurb">'+a[3]+'</div>'
      + '<div class="dbtn"><button class="go" data-act="noop">Approve</button><button data-act="msg:adviser">Ask a question</button></div></div>'; });
    h+='</div>'; }
  h+='<div class="sectlabel">History</div><div class="card">';
  var lm=''; if(!hist.length) h+='<p class="muted">Nothing under this filter.</p>';
  hist.forEach(function(a){ var m=MON[+a[0].split('-')[1]-1]+' '+a[0].split('-')[0];
    if(m!==lm){ h+='<div class="mdiv">'+m+'</div>'; lm=m; }
    h+='<div class="alert"><div class="atop"><span class="lbl">'+a[1]+'</span><span class="adate">'+dstr(a[0])+'</span></div><div class="atitle">'+a[2]+'</div><div class="ablurb">'+a[3]+'</div></div>'; });
  h+='</div>'+noteBlock('alerts')+'<div class="foot">Prototype for discussion. Not financial advice.</div>';
  document.getElementById('screen').innerHTML=h;
}

/* ---------- profile ---------- */
function renderProfile(){
  function o(key,val,label,s){ return '<button class="o" data-act="set:'+key+':'+val+'"><span>'+label+(s?'<span class="s">'+s+'</span>':'')+'</span>'
    + (lsGet('yt_'+key,key==='detail'?'essentials':(key==='view'?'provider':'GBP'))===val?'<span class="ck">✓</span>':'')+'</button>'; }
  var h='<div class="nwhead"><h1>Profile</h1></div>';
  h+='<p class="lead">Set the app up once to match how you think. None of this is shown to anyone else.</p>';
  h+='<div class="setlist">'
    + '<div class="sh">Default grouping on home</div>'
    + o('view','provider','By provider','Your current view') + o('view','assetclass','By asset class',null) + o('view','liquidity','By liquidity',null)
    + '<div class="sh">How much detail</div>'
    + o('detail','essentials','Essentials','Headline figures and next steps') + o('detail','full','Full detail','Every calculation shown')
    + '<div class="sh">Reporting currency</div>'
    + o('ccy','GBP','Pound sterling',null) + o('ccy','USD','US dollar',null) + o('ccy','EUR','Euro',null)
    + '</div>';
  var keys=[]; try{ for(var i=0;i<localStorage.length;i++){ var kk=localStorage.key(i); if(kk&&kk.indexOf('yt_n_')===0) keys.push(kk.slice(5)); } }catch(e){}
  keys.sort();
  var kn=keys.map(function(k){return {k:k,n:getNote(k)};}).filter(function(x){return x.n;});
  h+='<div class="sectlabel">Your notes</div><div class="card">';
  if(!kn.length) h+='<p class="muted">No notes yet. Add one from any screen.</p>';
  kn.forEach(function(x){ h+='<div class="alert"><div class="atop"><span style="font-weight:600;font-size:14px">'+esc(nLabel(x.k))+'</span><span class="adate">'+(x.n.u?dstr(x.n.u):'')+'</span></div><div class="ablurb">'+esc(x.n.t)+'</div></div>'; });
  h+='</div><div class="foot">Detail level also lets Y TREE pitch advice at the right depth. It is your preference, never a label shown to anyone.</div>';
  document.getElementById('screen').innerHTML=h;
}

/* ---------- sheet ---------- */
function renderSheet(){
  var host=document.getElementById('sheetHost'); if(host) host.remove();
  if(!state.sheet) return;
  var el=document.createElement('div'); el.id='sheetHost'; var inner='';
  if(state.sheet==='whose'){
    inner='<h2>Whose assets</h2><p class="muted">Changes the total and every view. Also the split an accountant needs.</p>'
      + ['All','Mine',"Partner's",'Joint'].map(function(o){ var v=sum(LEAF.filter(function(r){return o==='All'||r[2]===o;}).map(function(r){return r[5];}));
          return '<button class="opt" data-act="own:'+encodeURIComponent(o)+'">'+ownLabel(o)+'<span class="sfx">'+SYM[state.ccy]+Math.round(v*RATES[state.ccy]).toLocaleString('en-GB')+'</span>'+(state.owner===o?' <span class="ck">✓</span>':'')+'</button>'; }).join('');
  } else if(state.sheet==='export'){
    var x=state.xf;
    function xs(key,opts){ return '<div class="xseg">'+opts.map(function(o){return '<button data-act="xf:'+key+':'+o[0]+'" aria-pressed="'+(x[key]===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>'; }
    var PER={tax:'the 2025/26 tax year',cal:'calendar year 2025',since:'since you joined'}, GRP={account:'by account',assetclass:'by asset class',owner:'by owner'};
    var scope=state.owner==='All'?'your whole portfolio':ownLabel(state.owner)+' assets';
    inner='<h2>Statement for your accountant</h2><p class="muted">Replaces the report the client team prepares by hand each month.</p>'
      + '<div class="grp">Period</div>'+xs('period',[['tax','Tax year'],['cal','Calendar year'],['since','Since joined']])
      + '<div class="grp">Group holdings</div>'+xs('group',[['account','Account'],['assetclass','Asset class'],['owner','Owner']])
      + '<div class="grp">Format</div>'+xs('format',[['pdf','PDF'],['csv','Spreadsheet']])
      + '<div class="preview"><b>You will get:</b> a '+(x.format==='pdf'?'PDF':'spreadsheet')+' of '+scope+', '+GRP[x.group]+', covering '+PER[x.period]+', with valuations, cost basis and this year’s income. Dated '+AS_AT+'.</div>'
      + '<button class="send" data-act="noop">Prepare statement</button>';
  }
  el.innerHTML='<div class="sheet-bg" data-act="sheet:close"><div class="sheet" onclick="event.stopPropagation()">'+inner+'</div></div>';
  document.querySelector('.app').appendChild(el);
}

/* ---------- desktop side panel ---------- */
var PANEL={
  home:'This is the current app: the Net worth home, the same area chart and time ranges, the same category list. The only new thing is the Group by control. By provider is the default and is untouched; By asset class and By liquidity regroup the identical figures for the sophisticated minority who think that way.',
  performance:'Reached by tapping the home chart, as it is today. Over time is the net-worth line against a comparable-risk benchmark. Composition is that same total split by asset class over time. Table is the analyst pivot. The filter narrows to just the assets that need regular review, or just the long-term ones.',
  detail:'One reusable drill for every group, account and asset class, matching the current drill pattern: total value, a performance card against benchmark, then the holdings. Notes attach here.',
  pe:'Committed, called, uncalled and distributed capital plus the likely calls, in the shape the current app already uses for private equity.',
  messages:'The existing chat tab. Advice and updates are a conversation; only items that need a decision become Alerts, so the badge count stays meaningful.',
  alerts:'Advice runs through the app and is approved here. Decisions are pinned, everything else is history.',
  profile:'A short settings list. Default grouping is a preference, so the 85 percent who like things as they are never see a change.',
};
function renderSide(){
  document.getElementById('side').innerHTML=
      '<div class="eyebrow">The proposal</div><h2>One control, three lenses</h2>'
    + '<p>Y TREE’s app shows net worth grouped by which institution holds each asset. A minority, mostly private-equity and other sophisticated clients, think in asset class and in how quickly they can reach their money.</p>'
    + '<p>This adds a single <b>Group by</b> control to the existing home. It reuses the pattern the app already ships one level down (Providers / Account types), promoted to the top and extended with two lenses. The default never moves.</p>'
    + '<div class="eyebrow" style="margin-top:22px">This screen</div><p>'+(PANEL[state.route]||PANEL.home)+'</p>'
    + '<div class="fine">Fictional client, about £8.4m. Figures reconciled across every view. Companion to the one-page problem statement.</div>';
}

/* ---------- events ---------- */
function wireDates(){
  ['dF','dT'].forEach(function(id){ var e=document.getElementById(id); if(e) e.addEventListener('change',function(){
    var a=dateToIdx(document.getElementById('dF').value), b=dateToIdx(document.getElementById('dT').value);
    state.winFrom=Math.min(a,b); state.winTo=Math.max(a,b);
    if(state.winTo-state.winFrom<2) state.winTo=Math.min(NW.length-1,state.winFrom+2);
    state.chartIdx=null; renderPerformance();
  }); });
}
document.addEventListener('change',function(e){
  var s=e.target.closest('.pivsel'); if(s){ state[s.dataset.piv]=s.value; renderPerformance(); }
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var p=el.dataset.act.split(':'), k=p[0], v=p[1];
  if(k==='noop') return;
  if(k==='go'){ try{ location.hash = v==='home'?'':'#/'+v; }catch(err){} if(v==='performance') state.chartIdx=null; render(v); }
  else if(k==='view'){ state.view=v; lsSet('yt_view',v); state.chartIdx=null; renderHome(); }
  else if(k==='rng'){ state.range=v; state.chartIdx=null; renderHome(); }
  else if(k==='hp'){ state.chartIdx = v==='clear'?null:parseInt(v,10); renderHome(); }
  else if(k==='hide'){ state.hide=!state.hide; render(); }
  else if(k==='hint'){ state.hintDismissed=true; lsSet('yt_hint','1'); renderHome(); }
  else if(k==='sheet'){ state.sheet = v==='close'?null:v; renderSheet(); }
  else if(k==='own'){ state.owner=decodeURIComponent(v); lsSet('yt_owner',state.owner); state.sheet=null; state.chartIdx=null; render(); }
  else if(k==='xf'){ state.xf[v]=p[2]; renderSheet(); }
  else if(k==='detail'){ state.detail={k:v,v:decodeURIComponent(p.slice(2).join(':'))}; render('detail'); }
  else if(k==='pt'){ state.perfTab=v; state.chartIdx=null; renderPerformance(); }
  else if(k==='pf'){ state.perfFilter=v; state.chartIdx=null; renderPerformance(); }
  else if(k==='cp'){ state.chartIdx = v==='reset'?null:parseInt(v,10); renderPerformance(); }
  else if(k==='af'){ state.alertFilter=v; renderAlerts(); }
  else if(k==='msg'){ state.msgThread = v==='list'?null:v; render('messages'); }
  else if(k==='set'){ lsSet('yt_'+v,p[2]); if(v==='ccy') state.ccy=p[2]; if(v==='view') state.view=p[2]; renderProfile(); }
  else if(k==='note'){
    if(v==='edit'){ state.noteEdit=p[2]; render(); }
    else if(v==='save'){ var ta=document.getElementById('nta'); var txt=ta?ta.value.trim():'';
      if(txt){ var prev=getNote(p[2]); lsSet('yt_n_'+p[2], JSON.stringify({t:txt,c:(prev&&prev.c)||new Date().toISOString(),u:new Date().toISOString()})); }
      else { try{ localStorage.removeItem('yt_n_'+p[2]); }catch(err){} }
      state.noteEdit=null; render();
    } else { state.noteEdit=null; render(); }
  }
});
window.addEventListener('hashchange',function(){ render(); });
render();
</script>
