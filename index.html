<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y TREE — three lenses on one portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* the desk the phone sits on: warmer + darker than the app */
  --page:#17130E;
  /* the app */
  --canvas:#141109; --card:#1F1B12; --card-2:#272115; --border:#3A3225;
  --text:#F2EEE3; --dim:#B7AE9C; --faint:#897F6C;
  --accent:#C69A4E; --accent-ink:#17120A;          /* the one accent: warm gold */
  --ok:#63A468; --line:#332D20;
  --radius:15px; --tap:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ---- web-app shell: iPhone-proportioned frame + one context panel on desktop ---- */
.stage{display:flex;gap:44px;justify-content:center;align-items:flex-start;padding:48px 28px 72px;min-height:100vh}
.phone{flex:0 0 auto;width:393px;max-width:100%;padding:13px;border-radius:58px;position:relative;
  background:linear-gradient(155deg,#403a30,#17130d 46%,#0a0805);
  box-shadow:0 55px 120px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.045)}
.phone::before{content:"";position:absolute;top:24px;left:50%;transform:translateX(-50%);
  width:116px;height:33px;background:#000;border-radius:20px;z-index:5}
.app{border-radius:47px;overflow:hidden;background:var(--canvas);display:flex;flex-direction:column;
  height:min(830px,calc(100vh - 120px));aspect-ratio:393/852;position:relative}
.panel{flex:1 1 0;max-width:330px;position:sticky;top:48px;font-size:14px;color:var(--dim);line-height:1.62}
.panel .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.panel h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:20px;color:var(--text);margin:8px 0 10px;line-height:1.25}
.panel p{margin:10px 0}
.panel ul{list-style:none;margin:12px 0}
.panel li{padding-left:20px;position:relative;margin:9px 0}
.panel li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.panel .fine{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
@media (max-width:1000px){
  .stage{display:block;padding:0;background:var(--canvas)}
  .panel{display:none}
  .phone{width:100%;max-width:480px;margin:0 auto;padding:0;border-radius:0;box-shadow:none;background:none}
  .phone::before{display:none}
  .app{border-radius:0;height:auto;min-height:100dvh;aspect-ratio:auto}
}

/* ---- app chrome ---- */
.bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;
  padding:14px 18px;background:var(--canvas);border-bottom:1px solid var(--line)}
@media (min-width:1001px){ .app .bar{padding-top:42px} }
.brand{font-family:Fraunces,Georgia,serif;letter-spacing:.18em;font-size:14px;color:var(--accent)}
.back{background:none;border:0;color:var(--accent);font:inherit;font-size:15px;min-height:var(--tap);cursor:pointer;padding:0 2px}
.whose{margin-left:auto;background:var(--card);border:1px solid var(--border);color:var(--text);
  font:inherit;font-size:13px;border-radius:999px;min-height:36px;padding:0 13px;cursor:pointer;display:flex;align-items:center;gap:5px}
.whose .k{color:var(--faint);font-size:11px}
main{flex:1;overflow-y:auto;padding:20px 18px 30px}
main>*+*{margin-top:18px}

/* ---- type + blocks ---- */
h1.scr{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:22px}
.eyebrow{font-size:12px;letter-spacing:.05em;color:var(--faint)}
.hero{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:40px;line-height:1.05;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--faint);margin-top:5px}
p.lead{font-size:14px;color:var(--dim);line-height:1.6}
.muted{font-size:12.5px;color:var(--faint);line-height:1.55}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}

.status{display:flex;gap:12px;align-items:flex-start}
.status .d{width:9px;height:9px;border-radius:50%;background:var(--ok);margin-top:7px;flex:none}
.status .b{font-size:14px;color:var(--dim);line-height:1.55}
.status .b strong{color:var(--text);font-weight:600}
.linkbtn{color:var(--accent);background:none;border:0;font:inherit;font-size:13px;cursor:pointer;padding:0}
.quiet{color:var(--faint);background:none;border:0;font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0}

.decision{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.decision p{font-size:13px;color:var(--dim);line-height:1.55;margin:6px 0}
.dbtns{display:flex;gap:8px;margin-top:10px}
.dbtns button{flex:1;min-height:42px;border-radius:10px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.dbtns .approve{background:var(--accent);color:var(--accent-ink);border:0}
.dbtns .ask{background:none;border:1px solid var(--border);color:var(--dim)}

.note{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;
  padding:12px 13px;font-size:13px;color:var(--dim);line-height:1.55}
.note button{margin-left:4px}

/* view control */
.seg{display:flex;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px}
.seg button{flex:1;min-height:42px;border:0;border-radius:8px;background:none;color:var(--dim);
  font:inherit;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.hint{font-size:12.5px;color:var(--faint);line-height:1.55}

/* provider list */
.grp{margin-top:20px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:2px}
.grp-h .n{font-family:Fraunces,Georgia,serif;font-size:16px}
.grp-h .v{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px;white-space:nowrap}
.acct{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;
  padding:8px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;
  color:inherit;font:inherit;text-align:left;cursor:default}
.acct:last-child{border-bottom:0}
button.acct{cursor:pointer}
.acct .n{font-size:15px;display:block}
.acct .s{font-size:12px;color:var(--faint);margin-top:2px;display:block}
.acct .v{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap;text-align:right}
.acct .chev{color:var(--accent);font-size:13px}

/* pie + table */
.pie-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 14px}
.pie-wrap svg{transform:rotate(-90deg)}
.pie-c{font-family:Fraunces,Georgia,serif;font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.pie-s{font-size:12px;color:var(--faint)}
.leg{margin:8px 0 4px}
.leg .r{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line);width:100%;
  background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;padding:0;cursor:default}
.leg .r:last-child{border-bottom:0}
button.r{cursor:pointer}
.leg .sw{width:11px;height:11px;border-radius:3px;flex:none}
.leg .n{flex:1;font-size:14.5px}
.leg .v{font-variant-numeric:tabular-nums;font-size:14px;color:var(--dim)}
.leg .p{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--faint);width:44px;text-align:right}
.leg .chev{color:var(--accent);font-size:12px}

table.t{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
table.t td,table.t th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right}
table.t th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:600}
table.t tr.tot td{border-top:1px solid var(--border);border-bottom:0;font-weight:600;color:var(--text)}
.tcap{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:16px 0 2px}

.bucket{margin-top:12px}
.bucket .bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bucket .bn{font-family:Fraunces,Georgia,serif;font-size:16px}
.bucket .bv{font-variant-numeric:tabular-nums;color:var(--dim);font-size:14px}
.bucket p{font-size:13px;color:var(--dim);line-height:1.55;margin-top:5px}
.bucket .ret{font-size:12.5px;color:var(--faint);margin-top:5px}

.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.5}

/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(10,7,3,.6);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--card);border-top:1px solid var(--border);border-radius:18px 18px 0 0;
  padding:20px 18px 26px;max-height:86%;overflow-y:auto}
.sheet h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:19px;margin-bottom:6px}
.sheet .grp-l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;background:none;border:0;
  border-bottom:1px solid var(--line);color:var(--text);font:inherit;font-size:15px;text-align:left;cursor:pointer}
.opt:last-of-type{border-bottom:0}
.opt .ck{margin-left:auto;color:var(--accent);font-weight:700}
.opt .sfx{margin-left:auto;color:var(--faint);font-size:13px}
.xseg{display:flex;gap:5px;background:var(--canvas);border-radius:10px;padding:4px;margin-top:6px}
.xseg button{flex:1;min-height:40px;border:0;border-radius:7px;background:none;color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer}
.xseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.preview{background:var(--canvas);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.6}
.preview b{color:var(--text)}
.sheet .go{width:100%;background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;min-height:48px;font:inherit;font-weight:600;font-size:15px;cursor:pointer;margin-top:16px}
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="app">
    <header class="bar" id="bar"></header>
    <main id="screen"></main>
  </div></div>
  <aside class="panel" id="panel"></aside>
</div>

<script>
/* ============================================================================
   Y TREE — the same wealth, three lenses. Fictional client, figures reconciled.
   Source: stakeholder interview (25 Aug 2026) and the take-home brief.
   ========================================================================== */

var CLIENT='Jeanne', AS_AT='30 August 2026';

/* [providerGroup, account, owner, assetClass, liquidity, value] */
var LEAF=[
  ['Investment and cash accounts','Coutts current & savings','Joint','Cash','Liquid',180000],
  ['Investment and cash accounts','Fidelity Stocks & Shares ISA','Mine','Equities','Liquid',360000],
  ['Investment and cash accounts','Fidelity Stocks & Shares ISA','Mine','Bonds','Liquid',40000],
  ['Investment and cash accounts','Fidelity Stocks & Shares ISA','Mine','Cash','Liquid',20000],
  ['Investment and cash accounts','Fidelity General Investment Account','Joint','Equities','Liquid',820000],
  ['Investment and cash accounts','Fidelity General Investment Account','Joint','Bonds','Liquid',360000],
  ['Investment and cash accounts','Fidelity General Investment Account','Joint','Cash','Liquid',80000],
  ['Investment and cash accounts','Hargreaves Lansdown SIPP','Mine','Equities','Liquid',470000],
  ['Investment and cash accounts','Hargreaves Lansdown SIPP','Mine','Bonds','Liquid',210000],
  ['Investment and cash accounts','Hargreaves Lansdown SIPP','Mine','Cash','Liquid',30000],
  ['Investment and cash accounts','Vanguard Stocks & Shares ISA',"Partner's",'Equities','Liquid',220000],
  ['Investment and cash accounts','Vanguard Stocks & Shares ISA',"Partner's",'Bonds','Liquid',10000],
  ['Investment and cash accounts','Vanguard Stocks & Shares ISA',"Partner's",'Cash','Liquid',10000],
  ['Investment and cash accounts','NS&I Premium Bonds',"Partner's",'Cash','Liquid',50000],
  ['Residential properties','Primary residence, London','Joint','Property','Locked',3150000],
  ['Residential properties','Holiday home, Cornwall','Joint','Property','Locked',480000],
  ['Investment properties','Buy-to-let flat, Leeds','Joint','Property','Locked',200000],
  ['Business interests','Shareholding, Maple & Co Ltd','Mine','Private business','Locked',900000],
  ['Business interests','Bramble Consulting Ltd',"Partner's",'Private business','Locked',120000],
  ['Private equity','Bridgepoint Fund VII','Mine','Private equity','Locked',310000],
  ['Private equity','Oakley Capital Fund IV','Joint','Private equity','Locked',240000],
  ['Private equity','Inflexion Buyout Fund VI','Mine','Private equity','Locked',160000],
];
var GROUPS=['Investment and cash accounts','Residential properties','Investment properties','Business interests','Private equity'];
var GROUP_SHORT={'Investment and cash accounts':'Investment & cash'};
var CADENCE={
  'Investment and cash accounts':'Priced daily',
  'Residential properties':'Last valued 15 Aug 2026',
  'Investment properties':'Last valued 15 Aug 2026',
  'Business interests':'Last valued 30 Jun 2026',
  'Private equity':'Valued twice a year · next December',
};
var AC=[['Equities','#4E86C4'],['Bonds','#C97A45'],['Cash','#4FA089'],['Property','#C69A4E'],['Private business','#B5708F'],['Private equity','#8B7BC0']];

/* equities, the same fund often held at several providers */
var EQ=[
  ['Global Equity Index Fund',[['Fidelity ISA','Mine',150000],['Fidelity GIA','Joint',300000],['HL SIPP','Mine',160000],['Vanguard ISA',"Partner's",60000]]],
  ['US Equity Fund',[['Fidelity GIA','Joint',250000],['HL SIPP','Mine',170000]]],
  ['UK Equity Income Fund',[['Fidelity ISA','Mine',120000],['Vanguard ISA',"Partner's",120000]]],
  ['Emerging Markets Fund',[['Fidelity GIA','Joint',110000],['HL SIPP','Mine',70000]]],
  ['European Equity Fund',[['Fidelity GIA','Joint',150000]]],
  ['Apple Inc',[['Fidelity ISA','Mine',90000]]],
  ['Legal & General Group plc',[['HL SIPP','Mine',70000]]],
  ['Global Smaller Companies Fund',[['Fidelity GIA','Joint',10000],['Vanguard ISA',"Partner's",40000]]],
];

var state={
  view:'provider',
  owner:lsGet('yt_owner','All'),
  sheet:null, decisionOpen:false,
  volDismissed:lsGet('yt_vol','')==='1',
  hintDismissed:lsGet('yt_hint','')==='1',
  xf:{ period:'tax', group:'account', format:'pdf' },
};
function lsGet(k,d){ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* helpers */
function money(n){ return '£'+Math.round(n).toLocaleString('en-GB'); }
function sum(a){ return a.reduce(function(t,x){return t+x;},0); }
function pct(v,t){ return t?Math.round(v/t*100)+'%':'0%'; }
function rows(){ return state.owner==='All'?LEAF:LEAF.filter(function(r){return r[2]===state.owner;}); }
function total(){ return sum(rows().map(function(r){return r[5];})); }
function ownLabel(o){ return o==="Partner's"?"Partner’s":o; }

function donut(segs,tot,size){
  var r=size/2-Math.round(size*0.11), C=2*Math.PI*r, off=0;
  var sw=Math.round(size*0.16);
  var s=segs.map(function(x){
    var len=tot?x.v/tot*C:0;
    var c='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+x.c+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off+=len; return c;
  }).join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'+s+'</svg>';
}

/* ---------- router ---------- */
function render(){
  var drill = (location.hash==='#/equities');
  document.getElementById('bar').innerHTML = drill
    ? '<button class="back" data-act="home">‹ Back</button><span class="brand">Y TREE</span>'
    : '<span class="brand">Y TREE</span>'
      + '<button class="whose" data-act="sheet:whose"><span class="k">Whose</span> '+state.owner+' ▾</button>';
  if(drill) renderEquities(); else renderHome();
  renderSheet();
  renderPanel(drill?'equities':state.view);
  document.getElementById('screen').scrollTop=0;
}

/* ---------- home (one screen, three view states) ---------- */
function renderHome(){
  var t=total();
  var h='';

  h+='<section>'
    + '<div class="eyebrow">Total wealth'+(state.owner!=='All'?' · '+ownLabel(state.owner):'')+'</div>'
    + '<div class="hero">'+money(t)+'</div>'
    + '<div class="sub">As at '+AS_AT+'</div>'
    + '</section>';

  /* calm status: the health-tracker answer */
  h+='<section class="card status"><span class="d"></span><div class="b">'
    + '<strong>Everything is on track.</strong> Your wealth is doing what your plan expects. '
    + 'The next thing that will need you is the December private-equity valuation.'
    + '<div class="decision" id="dec">';
  if(state.decisionOpen){
    h+='<strong style="color:var(--text)">One decision is waiting</strong>'
      + '<p>A small change to lower your UK exposure: move £120,000 from a UK fund into your global one. '
      + 'It brings your UK weighting closer to your plan and slightly lowers cost.</p>'
      + '<p class="muted">Based on your agreed risk level, a home-bias check, and a lower fund charge.</p>'
      + '<div class="dbtns"><button class="approve" data-act="noop">Approve</button><button class="ask" data-act="noop">Ask a question</button></div>'
      + '<button class="quiet" data-act="dec:close" style="margin-top:10px">Close</button>';
  } else {
    h+='<button class="linkbtn" data-act="dec:open">1 decision is waiting — lower UK exposure. Review ›</button>';
  }
  h+='</div></div></section>';

  h+='<p class="muted">Since you joined, this setup has kept about <strong style="color:var(--dim)">£675,000</strong> more in your portfolio than your previous provider would have.</p>';

  if(!state.volDismissed){
    h+='<div class="note">Markets have moved sharply this month. Your plan is built for this, so there is nothing you need to do. <button class="quiet" data-act="vol">Dismiss</button></div>';
  }

  /* the one new control */
  h+='<div class="seg" role="group" aria-label="View">'
    + seg('provider','By provider') + seg('assetclass','By asset class') + seg('liquidity','By liquidity')
    + '</div>';
  if(!state.hintDismissed){
    h+='<p class="hint">New: the same wealth grouped by what it is, or by how quickly you can reach it. Your usual <b>By provider</b> view has not changed. <button class="quiet" data-act="hint">Got it</button></p>';
  }

  if(state.view==='provider') h+=viewProvider();
  else if(state.view==='assetclass') h+=viewAssetClass();
  else h+=viewLiquidity();

  h+='<div class="foot">Prototype for discussion. Not financial advice. All names and figures are illustrative and reconciled to one fictional client.</div>';
  document.getElementById('screen').innerHTML=h;
}
function seg(v,label){ return '<button data-act="view:'+v+'" aria-pressed="'+(state.view===v)+'">'+label+'</button>'; }

/* --- view 1: by provider (the default, unchanged in spirit) --- */
function viewProvider(){
  var rs=rows(), h='';
  GROUPS.forEach(function(g){
    var list=rs.filter(function(r){return r[0]===g;});
    if(!list.length) return;
    var st=sum(list.map(function(r){return r[5];}));
    var byAcct={}; list.forEach(function(r){ byAcct[r[1]]=(byAcct[r[1]]||0)+r[5]; });
    h+='<div class="grp"><div class="grp-h"><span class="n">'+(GROUP_SHORT[g]||g)+'</span><span class="v">'+money(st)+'</span></div>';
    Object.keys(byAcct).forEach(function(a){
      h+='<div class="acct"><span><span class="n">'+a+'</span><span class="s">'+CADENCE[g]+'</span></span><span class="v">'+money(byAcct[a])+'</span></div>';
    });
    h+='</div>';
  });
  h+='<p class="muted" style="margin-top:16px">This is the view most clients use. For anything not priced daily we show the last valuation date, never a day-to-day change.</p>';
  return h;
}

/* --- view 2: by asset class --- */
function viewAssetClass(){
  var rs=rows(), t=sum(rs.map(function(r){return r[5];}));
  var agg=AC.map(function(p){ return {name:p[0],c:p[1],v:sum(rs.filter(function(r){return r[3]===p[0];}).map(function(r){return r[5];}))}; }).filter(function(x){return x.v>0;});
  agg.sort(function(a,b){return b.v-a.v;});
  var h='<p class="lead" style="margin-top:14px">The same wealth, grouped by what it is — combined across every account and provider.</p>';
  h+='<div class="pie-wrap">'+donut(agg,t,190)+'<div class="pie-c">'+money(t)+'</div><div class="pie-s">'+agg.length+' asset classes</div></div>';
  h+='<div class="leg">';
  agg.forEach(function(x){
    var drill=x.name==='Equities';
    h+='<'+(drill?'button':'div')+' class="r"'+(drill?' data-act="equities"':'')+'>'
      + '<span class="sw" style="background:'+x.c+'"></span><span class="n">'+x.name+(drill?' <span class="chev">›</span>':'')+'</span>'
      + '<span class="v">'+money(x.v)+'</span><span class="p">'+pct(x.v,t)+'</span></'+(drill?'button':'div')+'>';
  });
  h+='</div>';
  h+='<p class="muted">Your mix sits close to your agreed risk level (68 against a target of 70). No action needed.</p>';
  h+='<p class="muted" style="margin-top:8px">Tap <b>Equities</b> to see every equity holding you own, combined. Your account view lists them separately; this is the only place your total exposure to a single fund or company is visible.</p>';
  return h;
}

/* --- view 3: by liquidity --- */
function viewLiquidity(){
  var rs=rows(), t=sum(rs.map(function(r){return r[5];}));
  var liq=sum(rs.filter(function(r){return r[4]==='Liquid';}).map(function(r){return r[5];}));
  var lock=t-liq;
  var agg=[{name:'Liquid',c:'var(--accent)',v:liq},{name:'Locked',c:'#6E6A60',v:lock}];
  var gains=Math.round(liq*0.28);
  var h='<p class="lead" style="margin-top:14px">Grouped by how quickly you could reach it. Private-equity and property are committed for years; cash and listed investments are not.</p>';
  h+='<div class="pie-wrap">'+donut(agg,t,190)+'<div class="pie-c">'+pct(liq,t)+'</div><div class="pie-s">of your wealth is reachable quickly</div></div>';
  h+='<div class="bucket"><div class="bh"><span class="bn">Liquid</span><span class="bv">'+money(liq)+' · '+pct(liq,t)+'</span></div>'
    + '<p>Cash and listed investments. Available within a few days. Fine to check as often as you like.</p>'
    + '<div class="ret">Up 6.2% over the last 12 months.</div></div>';
  h+='<div class="bucket"><div class="bh"><span class="bn">Locked</span><span class="bv">'+money(lock)+' · '+pct(lock,t)+'</span></div>'
    + '<p>Property, your business, and private equity. Valued a few times a year, not daily, so there is no price to watch. Private equity is committed for 8 to 12 years.</p>'
    + '<div class="ret">Last valued 30 June 2026.</div></div>';
  h+='<div class="card" style="margin-top:16px"><div class="grp-h"><span class="n" style="font-family:Fraunces,serif;font-size:15px">Reachable now, before tax</span><span class="v">'+money(liq)+'</span></div>'
    + '<p class="muted" style="margin-top:6px">About '+money(gains)+' of this is gains that may be taxable if sold.</p>'
    + '<button class="linkbtn" data-act="sheet:export" style="margin-top:8px">Prepare a statement for your accountant ›</button></div>';
  return h;
}

/* ---------- equities drill (the proof the new view does something the old cannot) ---------- */
function renderEquities(){
  var o=state.owner;
  var list=EQ.map(function(e){
    var p=e[1].filter(function(x){return o==='All'||x[1]===o;});
    return {name:e[0], provs:p, v:sum(p.map(function(x){return x[2];}))};
  }).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
  var t=sum(list.map(function(x){return x.v;}));
  var provCount=uniq(flat(list.map(function(x){return x.provs.map(function(p){return p[0];});}))).length;
  var h='<section><div class="eyebrow">Asset class</div><h1 class="scr">Equities</h1></section>';
  h+='<section><div class="hero" style="font-size:32px">'+money(t)+'</div>'
    + '<div class="sub">Held across '+provCount+' providers'+(o!=='All'?' · '+ownLabel(o):'')+'</div></section>';
  h+='<p class="lead">Every equity holding you own, combined. Your account view lists these separately.</p>';
  h+='<table class="t"><thead><tr><th>Holding</th><th class="n">Value</th><th class="n">Share</th></tr></thead><tbody>';
  list.forEach(function(x){
    var where=x.provs.map(function(p){return p[0];}).join(', ');
    var combined=x.provs.length>1?' · combined from '+x.provs.length+' accounts':'';
    h+='<tr><td>'+x.name+'<div class="s" style="font-size:11px;color:var(--faint);margin-top:2px">'+where+combined+'</div></td>'
      + '<td class="n">'+money(x.v)+'</td><td class="n">'+pct(x.v,t)+'</td></tr>';
  });
  h+='<tr class="tot"><td>Total</td><td class="n">'+money(t)+'</td><td class="n">100%</td></tr></tbody></table>';
  h+='<p class="muted">Example: your Apple exposure is £90,000 held directly, plus more inside the index and US funds. Full look-through of fund holdings is a natural next step.</p>';
  h+='<div class="foot">Prototype for discussion. Not financial advice. Figures illustrative.</div>';
  document.getElementById('screen').innerHTML=h;
}
function uniq(a){ var s=[]; a.forEach(function(x){ if(s.indexOf(x)<0)s.push(x); }); return s; }
function flat(a){ return a.reduce(function(t,x){return t.concat(x);},[]); }

/* ---------- sheets ---------- */
function renderSheet(){
  var host=document.getElementById('sheetHost'); if(host) host.remove();
  if(!state.sheet) return;
  var el=document.createElement('div'); el.id='sheetHost';
  var inner='';
  if(state.sheet==='whose'){
    inner='<h2>Whose assets</h2><p class="muted">Changes the total and every view below. Also the split an accountant needs.</p>'
      + ['All','Mine',"Partner's",'Joint'].map(function(o){
          var v=sum(LEAF.filter(function(r){return o==='All'||r[2]===o;}).map(function(r){return r[5];}));
          return '<button class="opt" data-act="own:'+encodeURIComponent(o)+'">'+ownLabel(o)+'<span class="sfx">'+money(v)+'</span>'+(state.owner===o?' <span class="ck">✓</span>':'')+'</button>';
        }).join('');
  } else if(state.sheet==='export'){
    var x=state.xf;
    function xs(key,opts){ return '<div class="xseg">'+opts.map(function(o){return '<button data-act="xf:'+key+':'+o[0]+'" aria-pressed="'+(x[key]===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>'; }
    var PER={tax:'the 2025/26 tax year',cal:'calendar year 2025',since:'since you joined'};
    var GRP={account:'by account',assetclass:'by asset class',owner:'by owner'};
    var scope=state.owner==='All'?'your whole portfolio':ownLabel(state.owner)+' assets';
    inner='<h2>Statement for your accountant</h2>'
      + '<p class="muted">This replaces the report the client team prepares by hand each month.</p>'
      + '<div class="grp-l">Period</div>'+xs('period',[['tax','Tax year'],['cal','Calendar year'],['since','Since joined']])
      + '<div class="grp-l">Group holdings</div>'+xs('group',[['account','Account'],['assetclass','Asset class'],['owner','Owner']])
      + '<div class="grp-l">Format</div>'+xs('format',[['pdf','PDF'],['csv','Spreadsheet']])
      + '<div class="preview"><b>You will get:</b> a '+(x.format==='pdf'?'PDF':'spreadsheet')+' of '+scope+', '+GRP[x.group]+', covering '+PER[x.period]+', with valuations, cost basis and this year’s income. Dated '+AS_AT+'.</div>'
      + '<button class="go" data-act="noop">Prepare statement</button>';
  }
  el.innerHTML='<div class="sheet-bg" data-act="sheet:close"><div class="sheet" onclick="event.stopPropagation()">'+inner+'</div></div>';
  document.querySelector('.app').appendChild(el);
}

/* ---------- desktop context panel ---------- */
var PANEL_SCREEN={
  provider:'The default. Wealth grouped by the institution that holds it, exactly as clients see it today. Nothing here has changed; the two new lenses sit beside it, not on top of it.',
  assetclass:'The lens sophisticated clients asked for. One figure per asset class, combined across every provider — something the current app cannot do. Tapping Equities proves it.',
  liquidity:'The lens private-equity clients asked for. Two buckets with their own check-in rhythm, so an 8-to-12-year commitment is never mixed into a number you glance at daily.',
  equities:'Every equity holding, combined across providers. The account view still lists them separately; this is the only place total exposure to one fund or company is visible.',
};
function renderPanel(key){
  document.getElementById('panel').innerHTML=
      '<div class="eyebrow">The idea</div>'
    + '<h2>The same wealth, three lenses</h2>'
    + '<p>Y TREE’s app shows a client’s wealth one way: by which institution holds it. A minority, mostly private-equity and other sophisticated clients, think in asset class and in how quickly they can reach their money.</p>'
    + '<p>This prototype adds those two lenses, plus an ownership filter, as opt-in views on the existing home. The default the change-averse majority rely on is untouched.</p>'
    + '<div class="eyebrow" style="margin-top:22px">This screen</div>'
    + '<p>'+(PANEL_SCREEN[key]||PANEL_SCREEN.provider)+'</p>'
    + '<ul><li>By provider — the unchanged default</li><li>By asset class — combined across providers</li><li>By liquidity — reachable now vs committed</li><li>Whose assets — Mine / Partner’s / Joint, for tax</li></ul>'
    + '<div class="fine">Fictional client, about £8.4m. Figures reconciled across every view. Companion to the one-page problem statement.</div>';
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var p=el.dataset.act.split(':'), k=p[0], v=p[1];
  if(k==='noop') return;
  if(k==='home'){ location.hash=''; render(); }
  else if(k==='equities'){ location.hash='#/equities'; render(); }
  else if(k==='view'){ state.view=v; render(); }
  else if(k==='sheet'){ if(v==='close'){ state.sheet=null; } else { state.sheet=v; } renderSheet(); }
  else if(k==='own'){ state.owner=decodeURIComponent(v); lsSet('yt_owner',state.owner); state.sheet=null; render(); }
  else if(k==='xf'){ state.xf[v]=p[2]; renderSheet(); }
  else if(k==='dec'){ state.decisionOpen=(v==='open'); renderHome(); }
  else if(k==='vol'){ state.volDismissed=true; lsSet('yt_vol','1'); renderHome(); }
  else if(k==='hint'){ state.hintDismissed=true; lsSet('yt_hint','1'); renderHome(); }
});
window.addEventListener('hashchange',render);
render();
</script>
