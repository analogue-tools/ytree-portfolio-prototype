<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y TREE, three lenses on one portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#101311; --card:#1C201D; --card-2:#242926; --border:#363C37; --hairline:#2C312D;
  --text:#F1EFE9; --dim:#B4B4AB; --faint:#7E7E74;
  --accent:#2F8F5B; --accent-ink:#08140D; --gold:#B4863A;
  --up:#3DDC84; --dn:#ec835a; --lime:#C6FF4D;
  --baseline:#3B423C;
  --ac-equities:#3987e5; --ac-bonds:#d95926; --ac-cash:#199e70;
  --ac-property:#c98500; --ac-business:#d55181; --ac-pe:#9085e9;
  --seq:#B4863A;
  --radius:16px; --tap:44px;
  --page:#18140F; --page-2:#211C16;
}
*{box-sizing:border-box;margin:0;padding:0}
button{-webkit-appearance:none;appearance:none;border:0;background:none;color:inherit;font:inherit}
html,body{background:var(--page)}
body{color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ---- shell ---- */
.stage{display:flex;gap:36px;justify-content:center;align-items:flex-start;padding:44px 28px 64px;min-height:100vh;
  max-width:1440px;margin:0 auto;background:radial-gradient(120% 80% at 50% 0%,var(--page-2),var(--page))}
.phone{flex:0 0 auto;width:393px;max-width:100%;padding:12px;border-radius:56px;position:relative;
  background:linear-gradient(150deg,#3a3a37,#16130f 45%,#0a0908);
  box-shadow:0 50px 110px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04)}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);
  width:118px;height:34px;background:#000;border-radius:20px;z-index:40}
.app{border-radius:46px;overflow:hidden;background:var(--canvas);display:flex;flex-direction:column;
  height:min(830px,calc(100vh - 108px));aspect-ratio:393/852;position:relative}
.app::after{content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  width:118px;height:4px;border-radius:999px;background:#fff;opacity:.85;z-index:46}
.side{flex:1 1 0;max-width:340px;position:sticky;top:44px;align-self:flex-start;font-size:14px;color:var(--dim);line-height:1.62}
.side .eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:600}
.side h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:20px;color:var(--text);margin:8px 0 10px;line-height:1.25}
.side p{margin:10px 0}
.side .fine{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);font-size:12.5px;color:var(--faint)}
@media (max-width:1080px){
  .stage{display:block;padding:0;background:var(--canvas)}
  .side{display:none}
  .phone{width:100%;max-width:520px;margin:0 auto;padding:0;border-radius:0;box-shadow:none;background:none}
  .phone::before,.app::after{display:none}
  .app{border-radius:0;height:auto;min-height:100dvh;aspect-ratio:auto}
}
#screen{flex:1;overflow-y:auto;padding:18px 16px 112px;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
#screen>*+*{margin-top:20px}

/* ---- Revolut-style header ---- */
.r-head{display:flex;align-items:center;gap:10px}
.r-av{width:38px;height:38px;border-radius:50%;background:#1a3d28;color:var(--lime);font-family:Fraunces,Georgia,serif;
  font-size:13px;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;flex:none}
.r-av .dot{position:absolute;top:0;right:0;width:8px;height:8px;background:#e23b3b;border-radius:50%;border:2px solid var(--canvas)}
.r-hello{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  background:#1A1F1C;border:1px solid var(--border);border-radius:12px;min-height:44px;padding:6px 12px;cursor:pointer}
.r-hello .k{font-size:12px;color:var(--faint);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.r-hello .v{font-size:13px;color:var(--text);font-weight:600;line-height:1.25}
.r-icon{width:44px;height:44px;border-radius:12px;background:#1F2623;border:1px solid var(--border);color:var(--text);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:14px;font-weight:600}
.r-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- navbar ---- */
.navbar{position:absolute;left:16px;right:16px;bottom:18px;z-index:45;display:flex;justify-content:space-around;
  background:rgba(20,22,24,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.09);border-radius:24px;
  padding:8px 6px;box-shadow:0 12px 28px rgba(0,0,0,.45)}
.navbar button{flex:1;color:#8E8E8E;font-size:10.5px;font-weight:500;cursor:pointer;padding:3px 0 2px;min-height:46px;
  display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.15}
.navbar button[aria-current="page"]{color:var(--lime)}
.navbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbar .b{position:absolute;transform:translate(12px,-6px);min-width:15px;height:15px;border-radius:999px;background:#d03b3b;color:#fff;
  border:2px solid #131516;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* ---- type ---- */
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--faint)}
h1.screen{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:23px}
.hero{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:40px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gain{font-size:14px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
.gain.up{color:var(--up)} .gain.dn{color:var(--dn)}
.gain .g-sub{color:var(--faint);font-weight:500}
.macro-note{font-size:12.5px;color:var(--faint);margin-top:5px}
.lead{font-size:14px;color:var(--dim);line-height:1.6}
.muted{color:var(--faint);font-size:12.5px;line-height:1.55}
.a-link{color:var(--accent);cursor:pointer;font-size:13px}
.quiet{color:var(--faint);cursor:pointer;font-size:12.5px;text-decoration:underline}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.an-head{display:flex;align-items:center;margin-bottom:2px}
.an-back{width:36px;height:36px;border-radius:50%;background:#1A1F1C;border:1px solid var(--border);color:#fff;font-size:18px;cursor:pointer}

/* 1. calm status headline */
.statusbar{display:flex;align-items:flex-start;gap:11px;background:rgba(47,143,91,.10);border:1px solid rgba(47,143,91,.28);border-radius:14px;padding:13px 14px}
.statusbar .tick{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.statusbar .sb-t{font-size:14px;color:var(--text);font-weight:600}
.statusbar .sb-s{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:2px}

/* 2. a decision that needs a response */
.deccard{border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:14px;padding:14px;background:var(--card)}
.deccard .dl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700}
.deccard .dt{font-size:15px;font-weight:600;margin-top:5px}
.deccard .db{font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:4px}
.deccard .dwhy{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:6px}
.dbtns{display:flex;gap:8px;margin-top:11px}
.dbtns button{flex:1;min-height:42px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--border);color:var(--text)}
.dbtns .approve{background:var(--gold);border-color:var(--gold);color:#1c1408}

/* 3. performance preview, opens the full screen */
.perfcard{width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 14px 12px;cursor:pointer}
.perfcard .pc-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.perfcard .pc-h .chev{color:var(--accent);font-size:14px}
.perfcard .pc-spark{margin:9px 0 7px}
.perfcard .pc-d{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.perfcard .pc-d .s{color:var(--faint);font-weight:500}
.perfcard .pc-ahead{font-size:12px;color:var(--dim);margin-top:3px}
.perfcard .pc-ahead b{color:var(--up)}
.notice{border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:12px;padding:12px 13px;font-size:13px;color:var(--dim);line-height:1.55;background:var(--card-2)}
.purpose{border-left:3px solid var(--accent);background:var(--card-2);border-radius:12px;padding:12px 13px;font-size:13px;color:var(--dim);line-height:1.55}
.purpose b{color:var(--text)}

/* segmented view control */
.seg{display:flex;gap:5px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px}
.seg button{flex:1;min-height:42px;border-radius:9px;color:var(--dim);font-size:13px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.hint{font-size:12.5px;color:var(--faint);line-height:1.55}

/* provider lens: group cards */
.hlist{display:flex;flex-direction:column;gap:12px}
.hgrp{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px 14px 6px}
.hgrp-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hgrp-ic{width:28px;height:28px;border-radius:8px;flex:none}
.hgrp-n{flex:1;min-width:0}
.hgrp-n b{display:block;font-size:16px;font-weight:600}
.hgrp-n small{display:block;font-size:12px;color:var(--faint);margin-top:1px}
.hgrp-v{text-align:right;font-variant-numeric:tabular-nums}
.hgrp-v b{display:block;font-size:19px;line-height:1.1}
.hgrp-v small{display:block;font-size:12px;margin-top:2px}
.hitem{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:11px 0;border-top:1px solid var(--hairline)}
.hitem-ic{width:34px;height:34px;border-radius:50%;background:#242A26;color:var(--dim);font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center;flex:none}
.hitem-m{min-width:0;display:flex;flex-direction:column}
.hitem-m b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hitem-m small{font-size:12px;color:var(--faint);margin-top:2px}
.hitem-v{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.hitem-v b{display:block;font-size:15px}
.hitem-v small{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.hopen{color:var(--accent);font-size:13px;padding:10px 0 2px;cursor:pointer}
.miw{display:flex;height:20px;border-radius:6px;overflow:hidden;margin:6px 0}
.miw span{display:block;height:100%}
.legrow{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:8px}
.legrow span{display:inline-flex;align-items:center;gap:6px}
.legrow i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* pie + legend + table */
.pie-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0 12px}
.pie-wrap svg{transform:rotate(-90deg)}
.pie-c{font-family:Fraunces,Georgia,serif;font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.pie-s{font-size:12px;color:var(--faint)}
.legend{margin:6px 0 4px}
.legend .lg{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;text-align:left;border-bottom:1px solid var(--hairline);cursor:pointer}
.legend .lg:last-child{border-bottom:0}
.legend .lg .n{flex:1;font-size:14px}
.legend .lg .v{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--dim)}
.legend .lg .p{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--faint);width:46px;text-align:right}
.legend .lg.tot{border-top:1px solid var(--baseline);margin-top:2px}
.legend .lg.tot .n,.legend .lg.tot .v{color:var(--text);font-weight:600}
.swatch{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}
.chev{color:var(--accent);font-size:12px}
.dtable{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
.dtable th,.dtable td{padding:8px 5px;border-bottom:1px solid var(--hairline);text-align:left}
.dtable th{font-size:11px;letter-spacing:.03em;color:var(--faint);font-weight:600;text-transform:uppercase}
.dtable td.n,.dtable th.n{text-align:right}
.dtable tr.grp td{color:var(--text);font-weight:600}
.dtable tr.grp td:first-child{font-family:Fraunces,Georgia,serif;font-weight:500}
.dtable td.ind{padding-left:14px;color:var(--dim)}
.dtable tr.tot td{border-top:1px solid var(--baseline);border-bottom:0;color:var(--text);font-weight:600;padding-top:9px}
.tblcap{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:16px 0 4px}

/* liquidity buckets */
.bucket{background:#161C19;border-radius:20px;overflow:hidden}
.bucket .bh{width:100%;display:flex;align-items:center;gap:10px;padding:15px 16px;text-align:left}
.bucket .bh .bic{width:26px;height:26px;border-radius:8px;flex:none}
.bucket .bh .bt{flex:1;min-width:0}
.bucket .bh .bn{font-size:15.5px;font-weight:600;display:block}
.bucket .bh .bv{font-size:15px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.bucket .bd{padding:0 16px 15px;font-size:12.5px;color:var(--dim);line-height:1.55}
.bucket .bd .ret{color:var(--faint);font-size:12px;margin-top:6px}

/* chart */
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--border);margin-bottom:12px}
.tabs button{border-bottom:2px solid transparent;color:var(--faint);font-size:14px;padding:8px 0;min-height:40px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.readout{font-family:Fraunces,Georgia,serif;font-size:17px;font-variant-numeric:tabular-nums}
.readout small{font-family:Inter,sans-serif;color:var(--faint);font-size:11.5px;display:block;font-weight:400;margin-top:2px}
.cbody{display:flex;gap:6px;margin-top:8px}
.cy{display:flex;flex-direction:column;justify-content:space-between;font-size:9px;color:var(--faint);text-align:right;padding:10px 0 4px;min-width:40px;font-variant-numeric:tabular-nums}
.cplot{flex:1;min-width:0}
.cx{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);margin-top:3px;padding-left:46px}
svg .ln{fill:none;stroke:var(--seq);stroke-width:2}
svg .lnp{fill:none;stroke:var(--seq);stroke-width:1.5;stroke-dasharray:3 3;opacity:.6}
svg .lnprov{fill:none;stroke:#8FA7C9;stroke-width:1.4;stroke-dasharray:4 3}
svg .lnmkt{fill:none;stroke:#7FB08A;stroke-width:1.4;stroke-dasharray:1 3}
.pwin{font-size:12.5px;color:var(--dim);margin-top:10px;font-variant-numeric:tabular-nums}
svg .base{stroke:var(--baseline)} svg .hit{fill:transparent;cursor:pointer} svg .dot{fill:var(--seq)}
.cmp{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.cmp button{border:1px solid var(--border);color:var(--dim);font-size:12px;border-radius:999px;min-height:34px;padding:0 11px;cursor:pointer}
.cmp button[aria-pressed="true"]{border-color:#8FA7C9;color:var(--text)}
.daterow{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.daterow input[type=date]{background:var(--card-2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:12.5px;border-radius:9px;min-height:38px;padding:0 9px;color-scheme:dark}
.daterow span{color:var(--faint);font-size:12.5px}
.pivwrap{overflow-x:auto;margin-top:10px}
.pivwrap table{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.pivwrap td,.pivwrap th{border:1px solid var(--hairline);padding:7px 9px;text-align:right;white-space:nowrap;min-width:58px}
.pivwrap th:first-child,.pivwrap td:first-child{text-align:left;min-width:104px;position:sticky;left:0;background:var(--card)}
.pivwrap thead th{color:var(--faint);font-size:10px;text-transform:uppercase;background:var(--card-2)}
.pivwrap tr.tot td{font-weight:600;color:var(--text);background:var(--card-2)}
.pivsel{background:var(--card-2);border:1px solid var(--border);color:var(--text);font:inherit;font-size:12.5px;border-radius:9px;min-height:38px;padding:0 8px;color-scheme:dark}

/* tiles + commit (PE) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.tile .k{font-size:11px;color:var(--faint)}
.tile .v{font-family:Fraunces,Georgia,serif;font-size:19px;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .x{font-size:10.5px;color:var(--faint);margin-top:4px;line-height:1.35}
.commit{height:20px;border-radius:6px;background:var(--card-2);display:flex;overflow:hidden;margin:8px 0}
.commit .c1{background:var(--accent)} .commit .c2{background:rgba(47,143,91,.28)}

/* alerts */
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 4px}
.fchip{border:1px solid var(--border);color:var(--dim);font-size:12px;border-radius:999px;min-height:34px;padding:0 12px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.month-div{font-size:11px;letter-spacing:.04em;color:var(--faint);padding:14px 0 4px;border-bottom:1px solid var(--hairline)}
.alert{padding:13px 0;border-bottom:1px solid var(--hairline)}
.alert:last-child{border-bottom:0}
.a-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lblchip{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:2px 9px;color:var(--dim)}
.lblchip.act{color:var(--accent);border-color:var(--accent)}
.a-date{font-size:11px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.a-title{font-size:14.5px;margin-top:6px}
.a-blurb{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:3px}

/* profile */
.setlist{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.setlist .sh{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:14px 16px 6px}
.setlist .o{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-top:1px solid var(--hairline);
  color:var(--text);font-size:14.5px;text-align:left;cursor:pointer;padding:0 16px}
.setlist .sh + .o{border-top:0}
.setlist .o .s{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.setlist .o .ck{margin-left:auto;color:var(--accent);font-weight:700}
.setlist .o .go{margin-left:auto;color:var(--accent);font-size:13px}

/* notes */
.note-card{background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:14px}
.note-ta{width:100%;min-height:78px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font:inherit;font-size:13px;padding:9px;resize:vertical}
.note-b{font-size:13px;color:var(--dim);line-height:1.55;white-space:pre-wrap}
.note-meta{font-size:11px;color:var(--faint);margin-top:6px}
.note-act{display:flex;gap:8px;margin-top:9px}
.note-act .sv{background:var(--accent);color:var(--accent-ink);border-radius:9px;min-height:38px;padding:0 15px;font-weight:600;font-size:13px;cursor:pointer}
.note-act .cn{border:1px solid var(--border);color:var(--dim);border-radius:9px;min-height:38px;padding:0 13px;font-size:13px;cursor:pointer}
.addnote{width:100%;border:1px dashed var(--border);color:var(--dim);border-radius:11px;min-height:44px;font-size:13.5px;cursor:pointer}

.foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--hairline);font-size:11.5px;color:var(--faint);line-height:1.5}

/* sheet */
.sheet-bg{position:absolute;inset:0;background:rgba(6,7,6,.62);display:flex;align-items:flex-end;z-index:60}
.sheet{width:100%;background:var(--card);border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:18px 16px 26px;max-height:82%;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:18px;margin-bottom:6px}
.sheet .grp{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-bottom:1px solid var(--hairline);color:var(--text);font-size:15px;text-align:left;cursor:pointer}
.opt:last-of-type{border-bottom:0}
.opt .ck{margin-left:auto;color:var(--accent);font-weight:700}
.opt .sfx{margin-left:auto;color:var(--faint);font-size:13px}
.xseg{display:flex;gap:5px;background:var(--canvas);border-radius:10px;padding:4px;margin-top:6px}
.xseg button{flex:1;min-height:40px;border-radius:7px;color:var(--dim);font-size:12.5px;cursor:pointer}
.xseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.preview{background:var(--canvas);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.6}
.preview b{color:var(--text)}
.sheet .go{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:11px;min-height:48px;font-weight:600;font-size:15px;cursor:pointer;margin-top:16px}

/* quick actions */
.act-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-size:11.5px;color:var(--dim)}
.act .ac-ic{width:52px;height:52px;border-radius:50%;background:#1A1F1C;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative}
.act .ac-ic svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act .ab{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:999px;background:#d03b3b;color:#fff;border:2px solid var(--canvas);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}

@media (max-width:1080px){
  .navbar{position:fixed;left:50%;right:auto;transform:translateX(-50%);width:calc(100% - 32px);max-width:488px}
}

var AC=[['Equities','var(--ac-equities)'],['Bonds','var(--ac-bonds)'],['Cash','var(--ac-cash)'],['Property','var(--ac-property)'],['Private business','var(--ac-business)'],['Private equity','var(--ac-pe)']];

var EQ=[
  ['Global Equity Index Fund',[['Fidelity ISA','Mine',150000],['Fidelity GIA','Joint',300000],['HL SIPP','Mine',160000],['Vanguard ISA',"Partner's",60000]]],

var PE=[['Bridgepoint Fund VII','Mine',500000,380000,180000,310000],['Oakley Capital Fund IV','Joint',400000,300000,140000,240000],['Inflexion Buyout Fund VI','Mine',300000,210000,100000,160000]];
var PE_CALLS=[['Q4 2026','Oakley Capital Fund IV','about £90,000'],['H1 2027','Bridgepoint Fund VII','about £120,000'],['H2 2027','Inflexion Buyout Fund VI','about £90,000']];
var ALERTS=[

];
var RATES={GBP:1,USD:1.27,EUR:1.17}, SYM={GBP:'£',USD:'$',EUR:'€'}, CNAME={GBP:'Pound sterling',USD:'US dollar',EUR:'Euro'};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function buildNW(){
  var seed=11,v=5000000,prior=5000000,market=5000000,contrib=4600000,out=[];
  function rnd(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }
  var d=new Date(2021,0,1),end=new Date(2026,7,1);
  while(d<=end){
    var y=d.getFullYear(),m=d.getMonth(),r=0.006+(rnd()-0.5)*0.028;
    if(y===2022&&m>=2&&m<=9) r-=0.022;
    if(y===2024&&m<=5) r+=0.014;
    if(y===2026&&m===6) r+=0.02;
    if(y===2026&&m===7) r-=0.035;
    v*=1+r; market*=1+r*0.95+(rnd()-0.5)*0.006; prior*=1+r-0.0018;
    var add=6000+rnd()*4000; if(m===3) add+=40000; if(y===2023&&m===5) add+=600000;
    contrib+=add; v+=add*0.98; market+=add*0.97; prior+=add*0.985;
    out.push({t:y+'-'+String(m+1).padStart(2,'0'),v:Math.round(v),prior:Math.round(prior),market:Math.round(market),c:Math.round(contrib)});
    d.setMonth(m+1);
  }
  var k=out[out.length-1],f=8420000/k.v,fp=7745000/k.prior,fm=8180000/k.market,fc=6900000/k.c;
  out.forEach(function(p){ p.v=Math.round(p.v*f); p.prior=Math.round(p.prior*fp); p.market=Math.round(p.market*fm); p.c=Math.round(p.c*fc); });
  return out;
}
var NW=buildNW();

var state={
  route:'home', view:'provider', owner:lsGet('yt_owner','All'), ccy:lsGet('yt_ccy','GBP'),
  sheet:null, decisionOpen:false,

  perfMode:'chart', cmp:{prior:false,market:false}, showProj:false, chartIdx:null,
  winFrom:NW.length-13, winTo:NW.length-1, pivRow:'assetclass', pivCol:'owner',
  alertFilter:'All', noteEdit:null, detail:null,
  xf:{ period:'tax', group:'account', format:'pdf' },
};
function lsGet(k,d){ try{ return localStorage.getItem(k)||d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function money(n){ var c=state.ccy; return SYM[c]+Math.round(n*RATES[c]).toLocaleString('en-GB'); }
function short(n){ var c=state.ccy,x=Math.round(n*RATES[c]),s=SYM[c],a=Math.abs(x);
  if(a>=1e6) return s+(x/1e6).toFixed(x%1e6?1:0)+'m'; if(a>=1e3) return s+Math.round(x/1e3)+'k'; return s+x; }
function sum(a){ return a.reduce(function(t,x){return t+x;},0); }
function pct(v,t){ return t?Math.round(v/t*100)+'%':'0%'; }
function rows(){ return state.owner==='All'?LEAF:LEAF.filter(function(r){return r[2]===state.owner;}); }
function total(){ return sum(rows().map(function(r){return r[5];})); }
function ownLabel(o){ return o==="Partner's"?"Partner’s":o; }
function ownScale(){ return total()/8420000; }
function mLabel(t){ var s=t.split('-'); return MON[+s[1]-1]+" ’"+s[0].slice(2); }
function uniq(a){ var s=[]; a.forEach(function(x){ if(s.indexOf(x)<0)s.push(x); }); return s; }
function flat(a){ return a.reduce(function(t,x){return t.concat(x);},[]); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function ini(s){ return s.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase(); }
function greet(){ var hr=new Date().getHours(); return hr<12?'Good morning':hr<18?'Good afternoon':'Good evening'; }

function donut(segs,tot,size){
  var r=size/2-Math.round(size*0.11),C=2*Math.PI*r,off=0,sw=Math.round(size*0.16);
  var s=segs.map(function(x){ var len=tot?x.v/tot*C:0;
    var c='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+x.c+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off+=len; return c; }).join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'+s+'</svg>';
}
function miniSpark(w,sc){
  var v=w.map(function(p){return p.v*sc;}),mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),pad=(mx-mn)*0.15||1; mn-=pad; mx+=pad;
  var W=280,H=46,X=function(i){return i*W/(v.length-1);},Y=function(y){return (1-(y-mn)/(mx-mn))*H;};
  var last=v.length-1;
  return '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'
    + '<polyline points="'+v.map(function(y,i){return X(i).toFixed(1)+','+Y(y).toFixed(1);}).join(' ')+'" fill="none" stroke="var(--seq)" stroke-width="2" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+X(last).toFixed(1)+'" cy="'+Y(v[last]).toFixed(1)+'" r="3" fill="var(--seq)" vector-effect="non-scaling-stroke"/></svg>';
}

/* notes */
function getNote(k){ var raw=lsGet('yt_n_'+k,''); if(!raw) return null;
  try{ var o=JSON.parse(raw); if(o&&o.t) return o; }catch(e){} return {t:raw,u:null}; }
function dstr(iso){ if(!iso) return ''; var d=new Date(iso); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); }
var NKEYS={home:'Home',assetclass:'Asset class',liquidity:'Liquidity',performance:'Performance',alerts:'Alerts'};
function noteBlock(k){

/* ---------- router ---------- */
function render(routeOverride){
  var hash=location.hash||'';
  state.route = routeOverride || (hash==='#/performance'?'performance':hash==='#/alerts'?'alerts':hash==='#/profile'?'profile'
    :hash==='#/equities'?'equities':hash==='#/pe'?'pe':'home');
  document.getElementById('nav').innerHTML=navHTML();
  var r=state.route;
  if(r==='performance') renderPerformance();
  else if(r==='alerts') renderAlerts();
  else if(r==='profile') renderProfile();
  else if(r==='equities') renderEquities();
  else if(r==='pe') renderPE();
  else if(r==='detail') renderDetail();
  else renderHome();
  renderSheet(); renderSide();
  document.getElementById('screen').scrollTop=0;
}

function renderHome(){
  var t=total(), sc=ownScale();
  var w=NW.slice(NW.length-13), d0=w[0].v*sc, dv=t-d0, dpc=d0?((t/d0-1)*100):0;
  var h='';
  h+='<div class="r-head">'

    + '</div>';

  h+='<section><div class="eyebrow">Total wealth'+(state.owner!=='All'?' · '+ownLabel(state.owner):'')+'</div>'
    + '<div class="hero">'+money(t)+'</div>'
    + '<div class="gain '+(dv>=0?'up':'dn')+'">'+(dv>=0?'+':'-')+money(Math.abs(dv))+' <span class="g-sub">'+(dpc>=0?'+':'')+dpc.toFixed(1)+'% over 12 months</span></div>'
    + '<div class="macro-note">As at '+AS_AT+'</div></section>';

  /* 1. calm status headline */
  h+='<div class="statusbar"><span class="tick">&#10003;</span><div>'

    + '<div class="sb-s">Your wealth is doing what your plan expects. The next thing that needs you is the December private-equity valuation.</div></div></div>';

  /* 2. a decision that needs a response */
  var pend=ALERTS.filter(function(a){return a[4]==='open';})[0];
  if(pend){
    h+='<div class="deccard"><div class="dl">Needs your decision</div>'

  }

  /* quick actions */
  h+='<div class="act-row">'
    + '<button class="act" data-act="go:alerts"><span class="ac-ic"><svg viewBox="0 0 24 24"><path d="M7 10a5 5 0 0 1 10 0c0 4 1.5 5.5 1.5 5.5H5.5S7 14 7 10zM10 18.5a1.5 1.5 0 0 0 4 0"/></svg>'+(pend?'<span class="ab">1</span>':'')+'</span>Notifications</button>'

    + '<button class="act" data-act="note:edit:'+(state.view==='provider'?'home':state.view)+'"><span class="ac-ic"><svg viewBox="0 0 24 24"><path d="M4 20h4L18 10l-4-4L4 16zM14 6l4 4"/></svg></span>Add note</button></div>';

  /* 3. performance preview, opens the full screen */
  h+='<button class="perfcard" data-act="go:performance">'
    + '<div class="pc-h"><span>Performance since you joined</span><span class="chev">&#8250;</span></div>'
    + '<div class="pc-spark">'+miniSpark(NW,sc)+'</div>'
    + '<div class="pc-ahead"><b>'+money(aheadOfPrior(sc))+' ahead</b> of what your previous provider would have returned</div>'

  if(!state.volDismissed) h+='<div class="notice">Markets have moved sharply this month. Your plan is built for this, so there is nothing you need to do. <button class="quiet" data-act="vol">Dismiss</button></div>';

  h+='<div class="seg" role="group" aria-label="View">'+seg('provider','By provider')+seg('assetclass','By asset class')+seg('liquidity','By liquidity')+'</div>';
  if(!state.hintDismissed) h+='<p class="hint">New: the same wealth grouped by what it is, or by how quickly you can reach it. Your usual <b>By provider</b> view has not changed. <button class="quiet" data-act="hint">Got it</button></p>';

  if(state.view==='provider') h+=viewProvider();
  else if(state.view==='assetclass') h+=viewAssetClass();
  else h+=viewLiquidity();

  h+=noteBlock(state.view==='provider'?'home':state.view);

  document.getElementById('screen').innerHTML=h;
  wireBrush();
}
function seg(v,l){ return '<button data-act="view:'+v+'" aria-pressed="'+(state.view===v)+'">'+l+'</button>'; }

function viewProvider(){
  var rs=rows(), t=sum(rs.map(function(r){return r[5];})), h='';
  var contribNow=NW[NW.length-1].c*ownScale(), growth=Math.max(0,t-contribNow);
  h+='<div class="card"><div class="tblcap">Where it came from</div>'
    + '<div class="miw"><span style="width:'+(contribNow/t*100)+'%;background:#6E6A60"></span><span style="width:'+(growth/t*100)+'%;background:var(--accent)"></span></div>'
    + '<div class="legrow"><span><i style="background:#6E6A60"></i>Money you added '+money(contribNow)+'</span><span><i style="background:var(--accent)"></i>Investment growth '+money(growth)+'</span></div></div>';
  h+='<div class="hlist">';
  GROUPS.forEach(function(g){
    var list=rs.filter(function(r){return r[0]===g;}); if(!list.length) return;
    var st=sum(list.map(function(r){return r[5];}));
    var byA={}; list.forEach(function(r){ if(!byA[r[1]])byA[r[1]]={v:0,cl:{},ow:{}}; byA[r[1]].v+=r[5]; byA[r[1]].cl[r[3]]=1; byA[r[1]].ow[r[2]]=1; });

function perfChart(w,sc,idx){

  var all=you.concat(proj); lines.forEach(function(s){ all=all.concat(s.pts); });

  var t2=sum(rs2.map(function(r){return r[5];}));
  var byA={}; rs2.forEach(function(r){ if(!byA[r[1]])byA[r[1]]={v:0,g:r[0],ow:{}}; byA[r[1]].v+=r[5]; byA[r[1]].ow[ownLabel(r[2])]=1; });
  var accs=Object.keys(byA).map(function(k){return {n:k,v:byA[k].v,g:byA[k].g,ow:Object.keys(byA[k].ow)};}).sort(function(a,b){return b.v-a.v;});
  var col=(AC.filter(function(a){return a[0]===D.v;})[0]||[])[1]||'transparent';
  var h=back+'<div class="eyebrow">Asset class</div><h1 class="screen">'+D.v+'</h1>';
  h+='<section style="margin-top:8px"><div class="hero" style="font-size:30px">'+money(t2)+'</div>'
    + '<div class="macro-note">Across '+accs.length+' account'+(accs.length>1?'s':'')+(o!=='All'?' · '+ownLabel(o):'')+'</div></section>';
  h+='<p class="lead">Every holding of this type you own, combined across providers. Your account view lists them separately.</p>';
  h+='<div class="card"><table class="dtable"><thead><tr><th>Account</th><th class="n">Value</th><th class="n">Share</th></tr></thead><tbody>'
    + accs.map(function(x){ return '<tr><td>'+x.n+'<div style="font-size:11px;color:var(--faint);margin-top:2px">'+(GS[x.g]||x.g)+' · '+x.ow.join(' & ')+'</div></td><td class="n">'+money(x.v)+'</td><td class="n">'+pct(x.v,t2)+'</td></tr>'; }).join('')
    + '<tr class="tot"><td>Total</td><td class="n">'+money(t2)+'</td><td class="n">100%</td></tr></tbody></table></div>';
  h+='<p class="muted">Fund-level look-through, cost basis and unrealised gain would be the next columns here.</p>';
  h+=noteBlock('cls:'+D.v);
  h+='<div class="foot">Prototype for discussion. Not financial advice. Figures illustrative.</div>';
  document.getElementById('screen').innerHTML=h;
}

/* ---------- alerts ---------- */
function renderAlerts(){
  var f=state.alertFilter;
  var open=ALERTS.filter(function(a){return a[4]==='open'&&(f==='All'||a[1]===f);});
  var hist=ALERTS.filter(function(a){return a[4]!=='open'&&(f==='All'||a[1]===f);}).sort(function(a,b){return a[0]<b[0]?1:-1;});
  var h='<h1 class="screen">Alerts</h1><p class="lead">Everything Y TREE has flagged for you. You are only notified for the ones that need a decision.</p>';
  h+='<div class="chiprow">'+['All','Decision','Advice','Valuation'].map(function(x){return '<button class="fchip" data-act="af:'+x+'" aria-pressed="'+(f===x)+'">'+x+'</button>';}).join('')+'</div>';
  if(open.length){
    h+='<div class="tblcap">Needs your decision</div><div class="card">';
    open.forEach(function(a){
      h+='<div class="alert"><div class="a-top"><span class="lblchip act">'+a[1]+'</span><span class="a-date">'+dstr(a[0])+'</span></div>'
        + '<div class="a-title">'+a[2]+'</div><div class="a-blurb">'+a[3]+'</div>'
        + '<div class="dbtns"><button class="approve" data-act="noop">Approve</button><button data-act="noop">Ask a question</button></div></div>';
    });
    h+='</div>';
  }
  h+='<div class="tblcap">History</div><div class="card">';
  var lm='';
  if(!hist.length) h+='<p class="muted">Nothing under this filter.</p>';
  hist.forEach(function(a){
    var m=MON[+a[0].split('-')[1]-1]+' '+a[0].split('-')[0];
    if(m!==lm){ h+='<div class="month-div">'+m+'</div>'; lm=m; }
    h+='<div class="alert"><div class="a-top"><span class="lblchip">'+a[1]+'</span><span class="a-date">'+dstr(a[0])+'</span></div>'
      + '<div class="a-title">'+a[2]+'</div><div class="a-blurb">'+a[3]+'</div></div>';
  });
  h+='</div>'+noteBlock('alerts')+'<div class="foot">Prototype for discussion. Not financial advice.</div>';
  document.getElementById('screen').innerHTML=h;
}

/* ---------- profile ---------- */
function renderProfile(){
  function o(key,val,label,s){ return '<button class="o" data-act="set:'+key+':'+val+'"><span>'+label+(s?'<span class="s">'+s+'</span>':'')+'</span>'
    + (lsGet('yt_'+key,key==='detail'?'essentials':'provider')===val?'<span class="ck">✓</span>':'')+'</button>'; }
  var h='<h1 class="screen">Profile</h1><p class="lead">Set the app up once to match how you think. None of this is shown to anyone else.</p>';
  h+='<div class="setlist">'
    + '<div class="sh">How much detail</div>'
    + o('detail','essentials','Essentials','Headline figures and next steps, plain language')
    + o('detail','full','Full detail','Every calculation and assumption shown')
    + '<div class="sh">Default view</div>'
    + o('dv','provider','By provider','The standard view')
    + o('dv','assetclass','By asset class',null) + o('dv','liquidity','By liquidity',null)
    + '<div class="sh">Reporting currency</div>'
    + o('ccy','GBP','Pound sterling',null) + o('ccy','USD','US dollar',null) + o('ccy','EUR','Euro',null)
    + '</div>';
  var keys=[]; try{ for(var i=0;i<localStorage.length;i++){ var kk=localStorage.key(i); if(kk&&kk.indexOf('yt_n_')===0) keys.push(kk.slice(5)); } }catch(e){}
  keys.sort();
  function nLabel(k){ if(NKEYS[k]) return NKEYS[k]; if(k.indexOf('acc:')===0) return k.slice(4); if(k.indexOf('cls:')===0) return k.slice(4)+' (asset class)'; return k; }
  var kn=keys.map(function(k){return {k:k,n:getNote(k)};}).filter(function(x){return x.n;});
  h+='<div class="tblcap">Your notes</div><div class="card">';
  if(!kn.length) h+='<p class="muted">No notes yet. Add one from any screen.</p>';
  kn.forEach(function(x){
    h+='<div class="alert"><div class="a-top"><span style="font-family:Fraunces,serif;font-size:14px">'+esc(nLabel(x.k))+'</span><span class="a-date">'+(x.n.u?dstr(x.n.u):'')+'</span></div><div class="a-blurb">'+esc(x.n.t)+'</div></div>';
  });
  h+='</div><div class="foot">Detail level also lets Y TREE pitch advice at the right depth. It is your preference, never a label shown to anyone.</div>';
  document.getElementById('screen').innerHTML=h;
}

/* ---------- sheets ---------- */
function renderSheet(){
  var host=document.getElementById('sheetHost'); if(host) host.remove();
  if(!state.sheet) return;
  var el=document.createElement('div'); el.id='sheetHost'; var inner='';
  if(state.sheet==='whose'){
    inner='<h2>Whose assets</h2><p class="muted">Changes the total and every view. Also the split an accountant needs.</p>'
      + ['All','Mine',"Partner's",'Joint'].map(function(o){
          var v=sum(LEAF.filter(function(r){return o==='All'||r[2]===o;}).map(function(r){return r[5];}));
          return '<button class="opt" data-act="own:'+encodeURIComponent(o)+'">'+ownLabel(o)+'<span class="sfx">'+money(v)+'</span>'+(state.owner===o?' <span class="ck">✓</span>':'')+'</button>';
        }).join('');
  } else if(state.sheet==='ccy'){
    inner='<h2>Show totals in</h2>'+['GBP','USD','EUR'].map(function(c){
        return '<button class="opt" data-act="ccyset:'+c+'">'+SYM[c]+'  '+CNAME[c]+(state.ccy===c?' <span class="ck">✓</span>':'')+'</button>';
      }).join('')+'<p class="muted" style="margin-top:12px">The overview converts at yesterday’s close. Detail screens keep the native figure.</p>';
  } else if(state.sheet==='export'){
    var x=state.xf;
    function xs(key,opts){ return '<div class="xseg">'+opts.map(function(o){return '<button data-act="xf:'+key+':'+o[0]+'" aria-pressed="'+(x[key]===o[0])+'">'+o[1]+'</button>';}).join('')+'</div>'; }
    var PER={tax:'the 2025/26 tax year',cal:'calendar year 2025',since:'since you joined'}, GRP={account:'by account',assetclass:'by asset class',owner:'by owner'};
    var scope=state.owner==='All'?'your whole portfolio':ownLabel(state.owner)+' assets';
    inner='<h2>Statement for your accountant</h2><p class="muted">Replaces the report the client team prepares by hand each month.</p>'
      + '<div class="grp">Period</div>'+xs('period',[['tax','Tax year'],['cal','Calendar year'],['since','Since joined']])
      + '<div class="grp">Group holdings</div>'+xs('group',[['account','Account'],['assetclass','Asset class'],['owner','Owner']])
      + '<div class="grp">Format</div>'+xs('format',[['pdf','PDF'],['csv','Spreadsheet']])
      + '<div class="preview"><b>You will get:</b> a '+(x.format==='pdf'?'PDF':'spreadsheet')+' of '+scope+', '+GRP[x.group]+', covering '+PER[x.period]+', with valuations, cost basis and this year’s income. Dated '+AS_AT+'.</div>'
      + '<button class="go" data-act="noop">Prepare statement</button>';
  }
  el.innerHTML='<div class="sheet-bg" data-act="sheet:close"><div class="sheet" onclick="event.stopPropagation()">'+inner+'</div></div>';
  document.querySelector('.app').appendChild(el);
}

/* ---------- desktop side panel ---------- */
var PANEL={
  home:'Default is By provider, exactly as clients see it today. By asset class and By liquidity are the two lenses the interview surfaced, added as opt-in views on the same screen with one dismissible line. Nothing moves for the change-averse majority.',
  performance:'Clients do check performance, especially when markets move. One screen for it: net worth over time, an optional comparison, a projection, a free date range. The number Y TREE is judged on, whether the client is ahead of their previous provider, is stated plainly. The Table tab is the analyst cut.',
  alerts:'Advice runs through the app and clients approve it here. Decisions that need a response are pinned; everything else is history. Notifications only fire for the pinned items.',
  profile:'A short settings list. Detail level doubles as how Y TREE pitches advice. Notes written on any screen collect here.',
  equities:'Every equity holding, combined across providers. The account view still lists them separately; this is the only place total exposure to one fund or company is visible.',
  pe:'Committed, called, uncalled and distributed capital, plus the likely future calls. No daily price, because there isn’t one.',
  detail:'The same drill for every account and every asset class, not just private equity. One reusable screen: an account broken down by what it holds, or an asset class broken down by where it is held. Notes attach here too.',
};
function renderSide(){
  document.getElementById('side').innerHTML=
      '<div class="eyebrow">The idea</div><h2>The same wealth, three lenses</h2>'
    + '<p>Y TREE’s app shows a client’s wealth one way: by which institution holds it. A minority, mostly private-equity and other sophisticated clients, think in asset class and in how quickly they can reach their money.</p>'
    + '<p>This prototype adds those two lenses plus an ownership filter as opt-in views on the existing home, and keeps only the supporting screens the interview justifies.</p>'
    + '<div class="eyebrow" style="margin-top:22px">This screen</div><p>'+(PANEL[state.route]||PANEL.home)+'</p>'
    + '<div class="fine">Fictional client, about £8.4m. Figures reconciled across every view. Companion to the one-page problem statement.</div>';
}

/* ---------- events ---------- */
function wireBrush(){}
function wireDates(){
  ['dF','dT'].forEach(function(id){ var e=document.getElementById(id); if(e) e.addEventListener('change',function(){
    var a=dateToIdx(document.getElementById('dF').value), b=dateToIdx(document.getElementById('dT').value);
    state.winFrom=Math.min(a,b); state.winTo=Math.max(a,b);
    if(state.winTo-state.winFrom<2) state.winTo=Math.min(NW.length-1,state.winFrom+2);
    state.chartIdx=null; renderPerformance();
  }); });
}
document.addEventListener('change',function(e){
  var s=e.target.closest('.pivsel'); if(s){ state[s.dataset.piv]=s.value; renderPerformance(); }
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var p=el.dataset.act.split(':'), k=p[0], v=p[1];
  if(k==='noop') return;
  if(k==='go'){ try{ location.hash = v==='home'?'':'#/'+v; }catch(err){} render(v); }
  else if(k==='view'){ state.view=v; renderHome(); }
  else if(k==='sheet'){ state.sheet = v==='close'?null:v; renderSheet(); }
  else if(k==='own'){ state.owner=decodeURIComponent(v); lsSet('yt_owner',state.owner); state.sheet=null; render(); }
  else if(k==='ccyset'){ state.ccy=v; lsSet('yt_ccy',v); state.sheet=null; render(); }
  else if(k==='xf'){ state.xf[v]=p[2]; renderSheet(); }
  else if(k==='dec'){ state.decisionOpen=(v==='open'); renderHome(); }
  else if(k==='vol'){ state.volDismissed=true; lsSet('yt_vol','1'); renderHome(); }
  else if(k==='hint'){ state.hintDismissed=true; lsSet('yt_hint','1'); renderHome(); }
  else if(k==='pmode'){ state.perfMode=v; state.chartIdx=null; renderPerformance(); }
  else if(k==='cmp'){ if(v==='proj') state.showProj=!state.showProj; else state.cmp[v]=!state.cmp[v]; renderPerformance(); }
  else if(k==='pr'){ var m=parseInt(v,10); state.winTo=NW.length-1; state.winFrom=m>=999?0:NW.length-1-m; state.chartIdx=null; renderPerformance(); }
  else if(k==='cp'){ state.chartIdx = v==='reset'?null:parseInt(v,10); renderPerformance(); }
  else if(k==='detail'){ state.detail={k:v,v:decodeURIComponent(p.slice(2).join(':'))}; render('detail'); }
  else if(k==='af'){ state.alertFilter=v; renderAlerts(); }
  else if(k==='set'){ lsSet('yt_'+v,p[2]); if(v==='ccy') state.ccy=p[2]; renderProfile(); }
  else if(k==='note'){
    if(v==='edit'){ state.noteEdit=p[2]; render(); }
    else if(v==='save'){ var ta=document.getElementById('nta'); var txt=ta?ta.value.trim():'';
      if(txt){ var prev=getNote(p[2]); lsSet('yt_n_'+p[2], JSON.stringify({t:txt,c:(prev&&prev.c)||new Date().toISOString(),u:new Date().toISOString()})); }
      else { try{ localStorage.removeItem('yt_n_'+p[2]); }catch(err){} }
      state.noteEdit=null; render();
    } else { state.noteEdit=null; render(); }
  }
});
window.addEventListener('hashchange',function(){ render(); });
var dv=lsGet('yt_dv','provider'); if(['provider','assetclass','liquidity'].indexOf(dv)>-1) state.view=dv;
render();
</script>
