<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Y TREE, three lenses on one portfolio</title>
<style>
:root{
  --bg:#141428; --bg-top:#1c1c3c; --card:#20203C; --card-2:#282848; --line:#33335A;
  --text:#FFFFFF; --dim:#9898B4; --faint:#6C6C8A;
  --teal:#3ED9CE; --teal-deep:#2FB6AE; --teal-ink:#06231F;
  --violet:#9585EC; --pos:#3FCB80; --neg:#F0586A; --pill:#2B2B4A;
  --ac-equities:#4F8DF7; --ac-bonds:#E8894A; --ac-cash:#3FCB80;
  --ac-property:#E0B341; --ac-business:#E066A6; --ac-pe:#9585EC;
  --ac-collect:#C47A4A; --ac-pinv:#6B8FC4; --ac-liab:#8A8AA8;
  --lens-provider:#8096F8; --lens-assetclass:#E0B341; --lens-liquidity:#3ED9CE;
  --accent:var(--teal); --gold:#E0B341;
  --radius:16px; --tap:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
button{-webkit-appearance:none;appearance:none;border:0;background:none;color:inherit;font:inherit}
html,body{background:#0c0c18;color-scheme:dark}
body{color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:44px 28px 64px;min-height:100vh;
  max-width:1440px;margin:0 auto;background:radial-gradient(130% 90% at 50% 0%,#20203f,#0c0c18)}
.phone{flex:0 0 auto;width:393px;max-width:100%;padding:12px;border-radius:56px;position:relative;
  background:linear-gradient(150deg,#3a3a44,#161622 46%,#0a0a12);
  box-shadow:0 50px 110px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04)}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);
  width:118px;height:34px;background:#000;border-radius:20px;z-index:40}
.app{border-radius:46px;overflow:hidden;background:linear-gradient(180deg,var(--bg-top),var(--bg) 240px);
  display:flex;flex-direction:column;height:min(830px,calc(100vh - 108px));aspect-ratio:393/852;position:relative}
.side{flex:1 1 0;max-width:360px;position:sticky;top:44px;align-self:flex-start;font-size:14px;color:var(--dim);line-height:1.62}
.side .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:700}
.side h2{font-weight:600;font-size:20px;color:var(--text);margin:8px 0 10px;line-height:1.25;letter-spacing:-.01em}
.side p{margin:10px 0}
.sidecard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 13px;margin-bottom:12px}
.sidecard .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700}
.sidecard h3{font-size:16px;line-height:1.25;color:var(--text);margin:7px 0 8px}
.sidecard .row{padding:0;border:0;display:block;margin:8px 0;font-size:13px;color:var(--dim);line-height:1.5;min-height:0;cursor:default;-webkit-user-select:text;user-select:text}
.sidecard .row > *{pointer-events:auto}
.sidecard .row b{color:var(--text);font-weight:600}
.sideul{list-style:none;margin:8px 0 0;padding:0}
.sideul li{position:relative;padding-left:16px;margin:8px 0;font-size:13px;color:var(--dim);line-height:1.5}
.sideul li::before{content:"\2192";position:absolute;left:0;top:0;color:var(--teal);font-weight:700}
.sideul b{color:var(--text);font-weight:600}
.side .fine{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
@media (max-width:1080px){
  .stage{display:block;padding:0;background:var(--bg)}
  .side{display:none}
  .phone{width:100%;max-width:520px;margin:0 auto;padding:0;border-radius:0;box-shadow:none;background:none}
  .phone::before{display:none}
  .app{border-radius:0;height:100dvh;aspect-ratio:auto}
  #appbar{padding-top:max(52px, calc(env(safe-area-inset-top, 0px) + 36px))}
}

#appbar{flex:none;position:relative;z-index:25;padding:54px 18px 8px;
  padding-top:max(54px, calc(env(safe-area-inset-top, 0px) + 40px));
  background:linear-gradient(180deg,var(--bg-top),rgba(28,28,60,.96));pointer-events:auto}
#appbar:empty{display:none;padding:0}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 18px 188px;scrollbar-width:none;position:relative;z-index:1}
#screen::-webkit-scrollbar{display:none}
#screen>*+*{margin-top:18px}

.navbar{position:absolute;left:18px;right:18px;bottom:10px;display:flex;justify-content:space-around;align-items:center;height:60px;
  background:rgba(16,16,32,.58);backdrop-filter:blur(18px);border:1px solid rgba(51,51,90,.55);border-radius:999px;z-index:30;pointer-events:auto;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.navbar button{width:62px;height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6E6E8A;position:relative}
.navbar button[aria-current="page"]{color:var(--teal)}
.navbar svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navbar .b{position:absolute;top:9px;right:9px;min-width:15px;height:15px;border-radius:999px;background:var(--neg);color:#fff;
  font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px;border:2px solid var(--bg)}

.nwhead{display:flex;align-items:center;gap:10px;min-height:34px}
.nwhead h1{font-size:20px;font-weight:600;letter-spacing:-.01em;flex:1;line-height:1.2;margin:0}
.nwicons{display:flex;align-items:center;gap:4px}
.iconbtn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--teal);cursor:pointer;flex:none}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.standout{color:var(--gold);background:rgba(224,179,65,.22)}
.whose{display:inline-flex;align-items:center;gap:6px;background:var(--pill);color:var(--text);font-size:12.5px;font-weight:600;
  border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.whose.on{border-color:var(--teal);background:rgba(62,217,206,.16);box-shadow:inset 0 0 0 1px var(--teal)}
.whose svg,.scopebtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.whose .cx{color:var(--teal);font-size:10px}
.backrow{display:flex;align-items:center;gap:2px;margin-bottom:2px;min-height:34px;position:relative}
.backrow button{display:inline-flex;align-items:center;gap:3px;color:var(--teal);font-size:15px;cursor:pointer;padding:4px 4px 4px 0;position:relative;z-index:1;flex:none}
.backrow .ttl{position:absolute;left:56px;right:56px;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.backrow .iconbtn{position:absolute;right:0;top:50%;transform:translateY(-50%);margin:0;padding:0}

.nwbig{font-size:40px;font-weight:600;letter-spacing:-.025em;color:var(--teal);line-height:1.05;margin-top:10px}
.nwdelta{margin-top:5px;font-size:14px;font-weight:600}
.nwdelta .since{color:var(--faint);font-weight:400;display:block;margin-top:2px;font-size:12.5px}
.riskline{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--dim)}
.riskline .rk{color:var(--dim);font-weight:500}
.riskbox{margin-top:10px}
.riskbox .riskrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px}
.riskbox .rk{font-weight:600;color:var(--text)}
.riskbox .rst{font-weight:600;color:var(--teal);white-space:nowrap}
.riskbox .rst.soft{color:var(--gold)}
.riskmeter{position:relative;height:6px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);margin-top:7px}
.riskmeter .fill{display:block;height:100%;border-radius:999px;background:var(--teal);opacity:.5}
.riskmeter .mark{position:absolute;top:-3px;width:2px;height:12px;margin-left:-1px;border-radius:1px;background:var(--text)}
.riskcurve{width:100%;height:52px;min-height:52px;display:block;margin-top:6px;overflow:visible;pointer-events:none}
.risknow{font-size:11px;color:var(--faint);margin-top:5px}
.up{color:var(--pos)} .dn{color:var(--neg)}
.flat{color:var(--dim)}
.pulses{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pulse{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.pulse .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.pulse .v{font-size:14px;font-weight:600;margin-top:3px}
.pulse .s{font-size:11px;color:var(--faint);margin-top:2px}
.market-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--pill);border-radius:999px;padding:3px;margin-top:9px}
.market-tabs button{min-height:31px;border-radius:999px;font-size:11px;color:var(--dim);cursor:pointer}
.market-tabs button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);font-weight:700}
.market-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.market-row:last-of-type{border-bottom:0}
.market-row .sw{width:8px;height:8px;border-radius:50%;flex:none}
.market-row .nm{flex:1;color:var(--dim)}
.market-impact{font-size:13px;color:var(--dim);margin-top:9px;line-height:1.45}
.vrpills{display:flex;gap:6px;margin-top:8px}
.vrpills button{border:1px solid var(--line);border-radius:999px;min-height:30px;padding:0 10px;font-size:11px;color:var(--dim);cursor:pointer}
.vrpills button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:700}
.xplain{list-style:none;margin-top:10px}
.xplain li{position:relative;padding-left:14px;font-size:12.5px;color:var(--dim);line-height:1.45;margin:5px 0}
.xplain li::before{content:"\2192";position:absolute;left:0;top:0;color:var(--teal);font-weight:700}
.xplain b{color:var(--text);font-weight:600}
.xplain-card{margin-top:12px}
.xplain-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.xplain-head .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.xplain-head .v{font-size:12px;color:var(--dim)}
.xplain-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.xplain-pill{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:8px 9px}
.xplain-pill .pk{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.xplain-pill .pv{font-size:14px;font-weight:600;margin-top:3px}
.xplain-note{font-size:12px;color:var(--dim);line-height:1.5;margin-top:8px}
.whyper{margin-top:2px;padding:0;overflow:visible;background:none;border:0;border-radius:0;box-shadow:none}
.whyper .whyhead{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  height:34px;min-height:34px;max-height:34px;padding:8px 12px;margin:0;
  background:none;border:0;border-radius:0;box-shadow:none;cursor:pointer;text-align:left;color:inherit}
.whyper .whylabel{font-size:14px;font-weight:600;line-height:1;margin:0;padding:0}
.whyper .whychev{flex:none;width:16px;height:16px;position:relative;color:var(--teal)}
.whyper .whychev::before{content:"▼";position:absolute;inset:0;font-size:9px;line-height:16px;text-align:center}
.whyper.open .whychev::before{content:"▲"}
.whyper .whybody{padding:6px 12px 10px}
.whyper .whywhen{font-size:12.5px;color:var(--faint);line-height:1.4;margin:0 0 12px}
.whyk{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:14px 0 4px}
.whyper .whybody .whyk:first-of-type{margin-top:0}
.whylist{list-style:none;margin:0;padding:0}
.whylist li{position:relative;padding-left:14px;font-size:14px;color:var(--dim);line-height:1.55;margin:8px 0}
.whylist li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--teal)}

.chartbox{cursor:pointer;overflow:visible;position:relative;z-index:0;touch-action:manipulation}
.spark{width:100%;height:150px;min-height:150px;display:block;overflow:visible}
.chartbox.lite .spark,.chartbox.lite .cy{height:96px;min-height:96px}
.readout{font-size:13px;color:var(--dim);margin-top:6px}
.readout b{color:var(--text);font-size:16px;font-weight:600}
.cx{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:4px}

.pills{display:flex;background:var(--pill);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:0 0 auto;min-width:44px;min-height:36px;border-radius:9px;font-size:12.5px;color:var(--dim);cursor:pointer;white-space:nowrap;padding:0 10px}
.pills button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);font-weight:700}

.lenscard{padding:0;background:none;border:0}
.lenses{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;background:var(--pill);border-radius:999px;padding:3px}
.lenses button{min-height:36px;border-radius:999px;padding:0 8px;cursor:pointer;user-select:none;
  display:flex;align-items:center;justify-content:center;color:var(--dim)}
.lenses button .glyph{display:none}
.lenses button .t{font-size:12px;font-weight:600;line-height:1.15;text-align:center;white-space:nowrap}
.lenses button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);font-weight:700}
.lenses button[aria-pressed="true"] .t{color:var(--teal-ink)}
.lens-note{font-size:11px;color:var(--faint);margin-top:7px}
.lens-tools{display:grid;grid-template-columns:1fr 1fr 72px;gap:7px;margin-top:8px}
.toolbtn{min-height:40px;border:1px solid var(--line);border-radius:999px;color:var(--dim);font-size:11.5px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:#1a1a30;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center}
.toolbtn b{color:var(--text);font-weight:600}
.toolbtn.on{background:rgba(62,217,206,.16);border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);color:var(--text)}
.toolbtn.on b{color:var(--text)}
.toolbtn .tb{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:999px;background:var(--teal);color:var(--teal-ink);font-size:10px;font-weight:700;padding:0 4px;flex:none}
.filtstrip{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 10px;background:rgba(62,217,206,.08);border:1px solid rgba(62,217,206,.28);border-radius:12px;font-size:12px;color:var(--dim);line-height:1.35}
.filtstrip b{color:var(--text);font-weight:600}
.filtstrip .clr{margin-left:auto;color:var(--teal);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.hint{font-size:12px;color:var(--faint);line-height:1.5;margin-top:8px}
.hint button{color:var(--teal);cursor:pointer;text-decoration:underline;font-size:12px}

.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--dim)}
.act .ic{width:48px;height:48px;border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;position:relative}
.act .ic svg{width:20px;height:20px;stroke:var(--teal);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act .bd{position:absolute;top:-1px;right:-1px;min-width:15px;height:15px;border-radius:999px;background:var(--neg);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);padding:0 3px}

.sectlabel{font-size:13px;font-weight:600;color:var(--text);margin:2px 0 0}
.sectlabel.l-provider,.sectlabel.l-assetclass,.sectlabel.l-liquidity{color:var(--text)}
.rows{display:flex;flex-direction:column;position:relative;z-index:2}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:var(--tap);padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;z-index:2;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(62,217,206,.18)}
.row.static{cursor:default;-webkit-tap-highlight-color:transparent;touch-action:auto}
.row:last-child{border-bottom:0}
.row > *{pointer-events:none}
.row .ic{width:30px;height:30px;border-radius:9px;flex:none}
.row .ic.rd{border-radius:50%;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--dim)}
.row .ic.photo{border-radius:50%;background-size:cover;background-position:center;background-repeat:no-repeat;
  border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden}
.row .ic.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.28))}
.row .ic.photo .fb{position:relative;z-index:1;background:rgba(7,10,18,.42);color:#F3F3F7;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.02em}
.row .m{flex:1;min-width:0}
.row .m b{font-size:15.5px;font-weight:500;display:block}
.row .m small{font-size:12px;color:var(--faint);display:block;margin-top:1px}
.taxbadges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.taxbadges .tb{font-size:10px;line-height:1;border:1px solid var(--line);border-radius:999px;color:var(--dim);padding:3px 7px}
.row .v{text-align:right;white-space:nowrap;padding-top:1px}
.row .v b{font-size:15.5px;font-weight:500;display:block}
.row .v small{font-size:12.5px;display:block;margin-top:1px}
.row .v small.z{color:var(--faint)}
.row .chev{color:var(--dim);font-size:18px;line-height:1;flex:none;padding-left:2px}
.rowtot{display:flex;justify-content:space-between;padding:13px 2px 2px;border-top:1px solid var(--line);font-weight:600;font-size:14.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.card .ch{font-size:13px;font-weight:600;margin-bottom:10px}
.chrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chrow .ch{margin-bottom:0}
.infobtn{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);color:var(--teal);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;line-height:1}
.dsum .lab{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.banner{width:100%;text-align:left;background:rgba(62,217,206,.10);border:1px solid rgba(62,217,206,.32);color:var(--text);border-radius:12px;padding:12px 14px;font-size:13px;cursor:pointer;line-height:1.4}
.ddrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ddrow .toolbtn{min-height:40px;overflow:visible;text-overflow:unset}
.contribrow{width:100%}
.rdist{margin-top:12px}
.rdist .rdist-mix{font-size:12.5px;color:var(--dim);margin:-2px 0 8px}
.rdist-stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--card-2);border:1px solid var(--line);margin:0 0 8px}
.rdist-stack i{display:block;height:100%;min-width:1px}
.rdist-row{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.rdist-row:last-of-type{border-bottom:0}
.rdist-row .nm{flex:1;min-width:0;color:var(--text);font-weight:500}
.rdist-row .nm small{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:1px}
.rdist-row .amt{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.rdist-row .lv{min-width:2.8em;text-align:right;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.rdist .rdist-note{font-size:12px;color:var(--dim);line-height:1.5;margin-top:8px}
.kv.expander{width:100%;text-align:left;cursor:pointer;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0}
.kv.expander .val{color:var(--faint);font-weight:400}

function buildNW(){
  var seed=11,v=5000000,bench=5000000,contrib=4600000,out=[];
  function rnd(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }
  var d=new Date(2021,0,1),end=new Date(2026,7,1);
  while(d<=end){
    var y=d.getFullYear(),m=d.getMonth(),r=0.006+(rnd()-0.5)*0.028;
    if(y===2022&&m>=2&&m<=9) r-=0.022;
    if(y===2024&&m<=5) r+=0.014;
    if(y===2026&&m===6) r+=0.02;
    if(y===2026&&m===7) r-=0.035;
    v*=1+r; bench*=1+r-0.0016+(rnd()-0.5)*0.004;
    var add=6000+rnd()*4000; if(m===3) add+=40000; if(y===2023&&m===5) add+=600000;
    contrib+=add; v+=add*0.98; bench+=add*0.985;
    out.push({t:y+'-'+String(m+1).padStart(2,'0'),v:Math.round(v),bench:Math.round(bench),c:Math.round(contrib)});
    d.setMonth(m+1);
  }
  var k=out[out.length-1],f=8420000/k.v,fb=7745000/k.bench,fc=6900000/k.c;
  out.forEach(function(p){ p.v=Math.round(p.v*f); p.bench=Math.round(p.bench*fb); p.c=Math.round(p.c*fc); });
  return out;
}

function miniDonut(items,total,size){
  var ring=(items||[]).filter(function(x){ return x.v>0; });
  var ringTot=sum(ring.map(function(x){ return x.v; }))||Math.abs(total)||1;
  var s=size||88, r=s/2-10, c=2*Math.PI*r, off=0;
  var segs=ring.map(function(x){
    var len=x.v/ringTot*c;
    var e='<circle cx="'+(s/2)+'" cy="'+(s/2)+'" r="'+r+'" fill="none" stroke="'+paintColour(x.c)+'" stroke-width="10" stroke-dasharray="'+len.toFixed(2)+' '+(c-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off+=len; return e;
  }).join('');
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 '+s+' '+s+'" style="transform:rotate(-90deg)" aria-hidden="true">'+segs+'</svg>';
}

function areaChart(win,sc,tapAct,idx){
  var W=320,H=150, v=win.map(function(p){return p.v*sc;}), N=v.length;
  var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),pad=(mx-mn)*0.12||1; mn-=pad; mx+=pad;
  var X=function(i){return N>1?i*W/(N-1):0;}, Y=function(y){return (1-(y-mn)/(mx-mn))*H;};
  var line=v.map(function(y,i){return X(i).toFixed(1)+','+Y(y).toFixed(1);}).join(' ');
  var area='0,'+H+' '+line+' '+W+','+H;
  var s='<svg class="spark" data-tap="'+(tapAct||'')+'" data-n="'+N+'" data-span="'+N+'" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="none" overflow="visible">'
    + yGrid(W,H)
    + '<polygon fill="#3ED9CE" fill-opacity="0.28" points="'+area+'"/>'
    + '<polyline class="ln" fill="none" stroke="#3ED9CE" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="'+line+'"/>';
  if(idx!=null&&idx>=0&&idx<N){
    s+='<line class="scan" x1="'+X(idx).toFixed(1)+'" y1="0" x2="'+X(idx).toFixed(1)+'" y2="'+H+'"/>'
      + '<circle class="dot" fill="#3ED9CE" stroke="#141428" stroke-width="2" cx="'+X(idx).toFixed(1)+'" cy="'+Y(v[idx]).toFixed(1)+'" r="4"/>';
  }
  if(tapAct){
    v.forEach(function(y,i){
      var left=i===0?-8:(X(i-1)+X(i))/2, right=i===N-1?(W+8):(X(i)+X(i+1))/2;
      s+='<rect class="hit" x="'+left.toFixed(1)+'" y="0" width="'+(right-left).toFixed(1)+'" height="'+H+'" fill="rgba(0,0,0,0)" pointer-events="all"/>';
    });
  }
  return s+'</svg>';
}

function benchSpark(ret,bench){
  var W=320,H=110,N=8, you=[], bn=[];
  for(var i=0;i<N;i++){
    var t=i/(N-1);
    you.push(ret*t + Math.sin(i*1.1)*0.35);
    bn.push(bench*t + Math.sin(i*0.9)*0.22);
  }
  var all=you.concat(bn), mn=Math.min.apply(null,all.concat([-1])), mx=Math.max.apply(null,all.concat([1]));
  var pad=(mx-mn)*0.18||1; mn-=pad; mx+=pad;
  var X=function(i){return i*W/(N-1);}, Y=function(v){return (1-(v-mn)/(mx-mn))*H;};
  var s='<svg class="spark" style="height:110px" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="110" preserveAspectRatio="none" overflow="visible">'+yGrid(W,H);
  s+='<polyline class="lnb" fill="none" stroke="#C8C8E0" stroke-width="1.8" stroke-dasharray="4 3" points="'+bn.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ')+'"/>';
  s+='<polyline class="ln" fill="none" stroke="#9585EC" stroke-width="2" points="'+you.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ')+'"/>';
  s+='</svg>';
  return '<div class="cbody" style="height:auto"><div class="cy" style="height:110px"><span>'+mx.toFixed(0)+'%</span><span>0%</span><span>'+mn.toFixed(0)+'%</span></div><div class="cplot">'+s+'</div></div>';

var EXPORT_GRP={account:'Account',assetclass:'Asset class',owner:'Whose',liquidity:'Liquidity'};
function exportGroupFromView(){
  if(state.route==='analytics'||state.route==='performance'){
    if(state.perfTab==='table' && PDIM[state.pivRow]) return state.pivRow;
    return 'assetclass';
  }
  if(state.route==='detail' && state.detail){
    if(state.detail.k==='class') return 'assetclass';
    if(state.detail.k==='liq') return 'liquidity';
    return 'account';
  }
  if(state.route==='pe') return 'account';
  if(state.view==='assetclass') return 'assetclass';
  if(state.view==='liquidity') return 'liquidity';
  return 'account';
}
function syncExportDefaults(){
  if(!state.xf) state.xf={period:'window',group:'account',format:'csv'};

function exportAnalyticsTab(){
  if(!(state.route==='analytics'||state.route==='performance')) return '';

}
function exportSliceLabel(){
  if(state.route==='detail' && state.detail && state.detail.v) return state.detail.v;

  var bits=[], p=state.xf.period;
  if(p==='tax') bits.push('2025/26 tax year');

  else if(p==='since') bits.push('since joined');
  else bits.push('this window');

  else if(state.perfLiq==='Locked') bits.push('Long term');

function exportHoldings(){

function exportHoldingsTable(){
  var rs=exportHoldings().slice().sort(function(a,b){ return b[5]-a[5]; });
  var header=['Holding','Account','Whose','Asset class','Liquidity','Value','Cost basis','Unrealised','Income this year'];
  var rows=rs.map(function(r){
    var cost=holdingCost(r), inc=holdingIncome(r);
    return [r[1], wrapLabel(r[1]), ownLabel(r[2]), r[3], r[4]==='Liquid'?'Available within days':'Long term', exportGbp(r[5]), exportGbp(cost), exportGbp(r[5]-cost), exportGbp(inc)];
  });
  var tot=sum(rs.map(function(r){return r[5];}));
  var costT=sum(rs.map(holdingCost)), incT=sum(rs.map(holdingIncome));
  rows.push(['Total','','','','',exportGbp(tot),exportGbp(costT),exportGbp(tot-costT),exportGbp(incT)]);
  return {header:header, rows:rows};
}
function exportGroupedTable(){
  var rs=exportHoldings(), by={};
  rs.forEach(function(r){
    var k=exportGroupKey(r);
    if(!by[k]) by[k]={n:k,v:0,cost:0,inc:0};
    by[k].v+=r[5]; by[k].cost+=holdingCost(r); by[k].inc+=holdingIncome(r);
  });
  var tot=sum(rs.map(function(r){return r[5];}));
  var items=Object.keys(by).map(function(k){ return by[k]; }).sort(function(a,b){ return b.v-a.v; });
  var header=[EXPORT_GRP[state.xf.group]||'Group','Value','Share %','Cost basis','Unrealised','Income this year'];
  var rows=items.map(function(x){
    return [x.n, exportGbp(x.v), tot?Math.round(x.v/tot*100):0, exportGbp(x.cost), exportGbp(x.v-x.cost), exportGbp(x.inc)];
  });
  var costT=sum(items.map(function(x){return x.cost;})), incT=sum(items.map(function(x){return x.inc;}));
  rows.push(['Total',exportGbp(tot),tot?100:0,exportGbp(costT),exportGbp(tot-costT),exportGbp(incT)]);
  return {header:header, rows:rows};
}
function exportLineTable(){
  var rs=exportHoldings();
  var t=sum(rs.map(function(r){return r[5];}));
  var tAll=sum(rows().map(function(r){return r[5];}));
  var sc=homeChartScale(t, tAll||t);
  var win=exportWin();
  if(!win||!win.length) win=windowNW();
  var header=['Date','Net worth','Benchmark','Invested capital'];
  var rows=(win||[]).map(function(p){
    return [p.t, exportGbp(p.v*sc), exportGbp((p.bench||0)*sc), exportGbp((p.c||0)*sc)];
  });
  return {header:header, rows:rows};
}
function exportCompositionTable(){
  var rs=exportHoldings();
  var t=sum(rs.map(function(r){return r[5];}));
  var tAll=sum(rows().map(function(r){return r[5];}));
  var sc=homeChartScale(t, tAll||t);
  var win=exportWin();
  if(!win||!win.length) win=windowNW();
  var series=samplePeriods(compSeries(win, sc), 8);
  var inc=filterAC();
  var last=series[series.length-1]||{seg:{},tot:0};
  var header=['Asset class'].concat(series.map(function(c){ return mLabel(c.t); })).concat(['Latest']);
  var rows=inc.map(function(n){
    return [n].concat(series.map(function(c){ return exportGbp(c.seg[n]||0); })).concat([exportGbp(last.seg[n]||0)]);
  });
  rows.push(['Total'].concat(series.map(function(c){ return exportGbp(c.tot||0); })).concat([exportGbp(last.tot||0)]));
  return {header:header, rows:rows};
}
function exportPivotTable(){
  var L2=exportHoldings();
  if(!L2.length) return {header:['Nothing in the current filter'], rows:[]};
  var rd=PDIM[state.pivRow]||PDIM.assetclass;
  if(state.pivCol==='time' || !state.pivCol){
    var cols=pivotTimeSeries(rd, L2);
    var rk=uniq(L2.map(rd.g));
    if(rd===PDIM.assetclass) rk=filterAC().slice();
    var last=cols[cols.length-1]||{seg:{},tot:0};
    rk.sort(function(a,b){ return (last.seg[b]||0)-(last.seg[a]||0); });
    var header=[rd.l].concat(cols.map(function(c){ return mLabel(c.t); })).concat(['Latest']);
    var rows=rk.map(function(a){
      return [a].concat(cols.map(function(c){ return exportGbp(c.seg[a]||0); })).concat([exportGbp(last.seg[a]||0)]);
    });
    rows.push(['Total'].concat(cols.map(function(c){ return exportGbp(c.tot||0); })).concat([exportGbp(last.tot||0)]));
    return {header:header, rows:rows};
  }
  var cd=state.pivCol==='none'?null:PDIM[state.pivCol];
  var rk=uniq(L2.map(rd.g)), ck=cd?uniq(L2.map(cd.g)):['Value'];
  var grid={};
  rk.forEach(function(a){ grid[a]={}; ck.forEach(function(b){ grid[a][b]=0; }); });
  L2.forEach(function(r){ var a=rd.g(r), b=cd?cd.g(r):'Value'; grid[a][b]+=r[5]; });
  var header=[rd.l].concat(ck);
  if(cd) header.push('Total');
  var rows=rk.map(function(a){
    var line=[a].concat(ck.map(function(b){ return exportGbp(grid[a][b]||0); }));
    if(cd) line.push(exportGbp(sum(ck.map(function(b){ return grid[a][b]||0; }))));
    return line;
  });
  var totLine=['Total'].concat(ck.map(function(b){ return exportGbp(sum(rk.map(function(a){ return grid[a][b]||0; }))); }));
  if(cd) totLine.push(exportGbp(sum(L2.map(function(r){ return r[5]; }))));
  rows.push(totLine);
  return {header:header, rows:rows};
}
function tableToCsv(title, tbl){

function downloadBlob(filename, mime, text){
  var blob=new Blob([text],{type:mime});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* ---------- events ---------- */
var brushDrag=null;
function setWinFromTo(a,b){
  var from=Math.max(0,Math.min(a,b)), to=Math.max(a,b);
  from=Math.max(0,Math.min(from,NW.length-1));
  to=Math.max(0,Math.min(to,NW.length-1));
  if(to<=from) to=Math.min(NW.length-1, from+1);
  state.winFrom=from; state.winTo=to; state.chartIdx=null; state.range='custom';
  persistWin();
}
function updateBrushDOM(){
  var n=Math.max(1,NW.length-1);
  var l=(state.winFrom/n)*100, r=(state.winTo/n)*100, w=Math.max(1.5,r-l);
  document.querySelectorAll('.brush .win').forEach(function(el){ el.style.left=l+'%'; el.style.width=w+'%'; });
  document.querySelectorAll('.brush .hnd[data-h="from"]').forEach(function(el){ el.style.left=l+'%'; });
  document.querySelectorAll('.brush .hnd[data-h="to"]').forEach(function(el){ el.style.left=r+'%'; });
  document.querySelectorAll('.tf-shown[data-tf="from"]').forEach(function(el){ el.textContent=idxToDMY(state.winFrom); });
  document.querySelectorAll('.tf-shown[data-tf="to"]').forEach(function(el){ el.textContent=idxToDMY(state.winTo); });
  document.querySelectorAll('.tf-in[data-tf="from"]').forEach(function(el){ el.value=idxToDate(state.winFrom); });
  document.querySelectorAll('.tf-in[data-tf="to"]').forEach(function(el){ el.value=idxToDate(state.winTo); });
}
function bindTimeFilter(){
  document.querySelectorAll('.tf-in').forEach(function(inp){
    if(inp.dataset.bound==='1') return;
    inp.dataset.bound='1';
    inp.addEventListener('change',function(){
      var root=this.closest('.tfilter')||document;
      var f=root.querySelector('.tf-in[data-tf="from"]');
      var t=root.querySelector('.tf-in[data-tf="to"]');
      if(!f||!t) return;
      setWinFromTo(dateToIdx(f.value), dateToIdx(t.value));
      refreshView();
    });
  });
  document.querySelectorAll('.brushBox').forEach(function(box){
    if(box.dataset.bound==='1') return;
    box.dataset.bound='1';
    box.addEventListener('pointerdown',function(e){
      if(e.button!=null && e.button!==0) return;
      startBrushDrag(box, e.clientX, e.target);
      try{ box.setPointerCapture(e.pointerId); }catch(err){}
      if(e.cancelable) e.preventDefault();
      e.stopPropagation();
    });
    box.addEventListener('touchstart',function(e){
      if(!e.touches||!e.touches.length) return;
      if(!brushDrag) startBrushDrag(box, e.touches[0].clientX, e.target);
      if(e.cancelable) e.preventDefault();
      e.stopPropagation();
    },{passive:false});
  });
}
function applyPlotTap(svg, clientX){
  var act=svg.getAttribute('data-tap');
  var n=parseInt(svg.getAttribute('data-n'),10)||0;
  var span=parseInt(svg.getAttribute('data-span'),10)||n;
  if(!act || n<1) return false;
  var r=svg.getBoundingClientRect();
  var x=Math.max(0,Math.min(1,(clientX-r.left)/Math.max(1,r.width)));
  var i=Math.round(x*Math.max(0,span-1));
  if(i>=n) i=n-1;
  if(i<0) i=0;
  if(act==='hp' || act==='cp'){ state.chartIdx=i; refreshView(); return true; }
  if(act==='da'){ state.detailIdx=i; refreshView(); return true; }
  return false;
}
function bindPlotTaps(){
  document.querySelectorAll('svg[data-tap]').forEach(function(svg){
    if(svg.dataset.boundTap==='1') return;
    svg.dataset.boundTap='1';
    svg.addEventListener('click', function(e){
      applyPlotTap(svg, e.clientX);
    });
  });
}
function startBrushDrag(box, clientX, target){
  var r=box.getBoundingClientRect();
  var h=target&&target.closest?target.closest('.hnd'):null;
  var which=h?h.getAttribute('data-h'):null;
  if(!which){
    var n=Math.max(1,NW.length-1);
    var fromX=r.left+(state.winFrom/n)*r.width;
    var toX=r.left+(state.winTo/n)*r.width;
    if(Math.abs(clientX-fromX)<=22) which='from';
    else if(Math.abs(clientX-toX)<=22) which='to';
    else which='win';
  }
  brushDrag={
    box:box, which:which,
    startFrom:state.winFrom, startTo:state.winTo,
    startX:clientX, left:r.left, width:r.width
  };
}
function applyBrushDrag(clientX){
  if(!brushDrag) return;
  var n=NW.length-1;
  var x=Math.max(0,Math.min(1,(clientX-brushDrag.left)/Math.max(1,brushDrag.width)));
  var i=Math.round(x*n);
  if(brushDrag.which==='from'){
    state.winFrom=Math.max(0,Math.min(i,state.winTo-1));
  } else if(brushDrag.which==='to'){
    state.winTo=Math.min(n,Math.max(i,state.winFrom+1));
  } else {
    var span=brushDrag.startTo-brushDrag.startFrom;
    var di=Math.round((clientX-brushDrag.startX)/Math.max(1,brushDrag.width)*n);
    var nf=Math.max(0,Math.min(n-span, brushDrag.startFrom+di));
    state.winFrom=nf; state.winTo=nf+span;
  }
  state.range='custom';
  updateBrushDOM();
}
function endBrushDrag(){
  if(!brushDrag) return;
  brushDrag=null;
  persistWin();
  refreshView();
}
document.addEventListener('pointermove',function(e){
  if(!brushDrag) return;
  applyBrushDrag(e.clientX);
  if(e.cancelable) e.preventDefault();
},{passive:false});
document.addEventListener('pointerup',endBrushDrag);
document.addEventListener('pointercancel',function(){ brushDrag=null; });
document.addEventListener('touchmove',function(e){
  if(!brushDrag) return;
  var t=e.touches[0]||e.changedTouches[0];
  if(!t) return;
  applyBrushDrag(t.clientX);
  if(e.cancelable) e.preventDefault();
},{passive:false});
document.addEventListener('touchend',endBrushDrag);
document.addEventListener('touchcancel',function(){ brushDrag=null; });
function wireDates(){
  document.querySelectorAll('.tf-in').forEach(function(e){
    e.addEventListener('change',function(){
      var root=this.closest('.tfilter')||document;
      var f=root.querySelector('.tf-in[data-tf="from"]');
      var t=root.querySelector('.tf-in[data-tf="to"]');
      if(!f||!t) return;
      setWinFromTo(dateToIdx(f.value), dateToIdx(t.value));
      refreshView();
    });
  });
}
function applyPerfCustomRange(){
  var f=document.querySelector('.tf-in[data-tf="from"]'), t=document.querySelector('.tf-in[data-tf="to"]');

}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  if(el.disabled) return;
  var p=el.dataset.act.split(':'), k=p[0], v=p[1];
  if(k==='noop') return;
  if(k==='go'){
    state.noteEdit=null;
    if(v==='performance') v='analytics';

  }
  else if(k==='view'){

    state.chartIdx=null; refreshView();
  }
  else if(k==='rng'){
    setPerfWindowPreset(v);
    refreshView();
  }
  else if(k==='mq'){
    state.marketRange=v;
    lsSet('yt_market_range',v);
    refreshView();
  }
  else if(k==='hp'){ state.chartIdx = v==='clear'?null:parseInt(v,10); refreshView(); }
  else if(k==='hide'){ state.hide=!state.hide; refreshView(); }
  else if(k==='hint'){ state.hintDismissed=true; lsSet('yt_hint','1'); refreshView(); }
  else if(k==='sheet'){
    if(v==='close' && el.classList.contains('sheet-bg') && e.target.closest('.sheet')) return;
    if(v==='export') syncExportDefaults();
    state.sheet = v==='close'?null:v; renderSheet(); bindTimeFilter();
  }
  else if(k==='stmt'){

  }
  else if(k==='own'){ state.noteEdit=null; state.owner=decodeURIComponent(v); lsSet('yt_owner',state.owner); if(state.sheet==='whose') state.sheet=null; state.chartIdx=null; refreshView(); }
  else if(k==='date'){
    if(v==='clear'){ clearDateWindow(); state.sheet=null; refreshView(); }
    else if(v==='open'){
      var tf=document.querySelector('#screen .tfilter');
      if(tf){
        state.sheet=null; renderSheet();
        tf.scrollIntoView({behavior:'smooth', block:'nearest'});
        tf.classList.add('hi');
        setTimeout(function(){ tf.classList.remove('hi'); }, 1100);
      } else {
        state.sheet='perfdate'; renderSheet(); bindTimeFilter();
      }
    }
  }
  else if(k==='filt'){
    if(v==='clear'){ clearFilters(); state.sheet=null; refreshView(); }
  }
  else if(k==='hf'){
    if(v==='clear'){ saveTypes([]); state.perfLiq='All'; lsSet('yt_p_liq','All'); state.sheet=null; }
    else if(v==='asset'){ toggleType(decodeURIComponent(p[2])); }
    else if(v==='liq'){ state.perfLiq=decodeURIComponent(p[2]); lsSet('yt_p_liq',state.perfLiq); }
    state.chartIdx=null; refreshView();
  }
  else if(k==='hs'){
    if(v==='set'){ state.homeSort=p[2]; lsSet('yt_h_sort',state.homeSort); }
    state.chartIdx=null; refreshView();
  }
  else if(k==='pfa'){
    if(v==='set'){ toggleType(decodeURIComponent(p[2])); }
    if(state.perfProvider!=='All' && typesOn().length){
      var has=perfRows().some(function(r){ return typesOn().indexOf(r[3])>=0; });
      if(!has){ state.perfProvider='All'; lsSet('yt_p_provider','All'); }
    }
    state.chartIdx=null;
    refreshView();
  }
  else if(k==='pfl'){
    if(v==='set'){ state.perfLiq=decodeURIComponent(p[2]); state.perfFilter=state.perfLiq==='Liquid'?'liquid':state.perfLiq==='Locked'?'locked':'all'; lsSet('yt_p_liq',state.perfLiq); }
    state.chartIdx=null;
    refreshView();
  }
  else if(k==='pfp'){
    if(v==='set'){ state.perfProvider=decodeURIComponent(p[2]); lsSet('yt_p_provider',state.perfProvider); }
    state.chartIdx=null;
    refreshView();
  }
  else if(k==='pfs'){
    if(v==='set'){ state.perfSort=p[2]; lsSet('yt_p_sort',state.perfSort); }
    state.sheet=null; state.chartIdx=null;
    refreshView();
  }
  else if(k==='cmp'){
    if(v==='panel'){
      if(state.cmpOpen && !cmpAnyOn()) state.cmpOpen=false;
      else state.cmpOpen=true;
    } else if(v==='toggle'){
      var key=p[2];
      if(key==='bench') state.cmpBench=!state.cmpBench;
      else if(key==='capital') state.cmpCapital=!state.cmpCapital;
      else if(key==='proj') state.cmpProj=!state.cmpProj;
      lsSet('yt_ov_bench',state.cmpBench?'1':'0');
      lsSet('yt_ov_capital',state.cmpCapital?'1':'0');
      lsSet('yt_ov_proj',state.cmpProj?'1':'0');
